<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FUT Champions Overlay</title>
<style>
  :root { --green:#1f6b35; --glow:rgba(31,107,53,.9); }
  html, body { margin:0; background:transparent; font-family:"Segoe UI",Helvetica,Arial,sans-serif; }
  .wrap { display:inline-flex; align-items:center; gap:18px; padding:30px; }
  .box { box-sizing:border-box; width:110px; height:110px; display:flex; align-items:center; justify-content:center;
         border:4px solid var(--green); border-radius:10px; color:#fff; font-size:64px; font-weight:800;
         box-shadow:0 0 14px 2px var(--glow), inset 0 0 14px 2px var(--glow);
         animation:pulse 15s infinite; }
  .minus { width:28px; height:6px; border-radius:3px; background:var(--green); box-shadow:0 0 10px var(--glow); }
  .num { display:block; }

  /* still for most of the 15 seconds, then one soft pulse */
  @keyframes pulse {
    0%, 90%, 100% { transform:scale(1); box-shadow:0 0 14px 2px var(--glow), inset 0 0 14px 2px var(--glow); }
    95% { transform:scale(1.06); box-shadow:0 0 22px 6px var(--glow), inset 0 0 22px 6px var(--glow); }
  }

  /* when a number changes: the new value drops in with a pop, and the border flashes */
  .num.tick { animation:drop .5s cubic-bezier(.2,1.4,.4,1); }
  .box.flash { animation:pulse 15s infinite, flash .6s ease-out; }
  @keyframes drop {
    0%   { transform:translateY(-40px) scale(1.4); opacity:0; }
    60%  { opacity:1; }
    100% { transform:translateY(0) scale(1); opacity:1; }
  }
  @keyframes flash {
    0%   { border-color:#6fe08c; box-shadow:0 0 30px 10px #6fe08c, inset 0 0 30px 10px #6fe08c; }
    100% { border-color:var(--green); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="box" id="wb"><span class="num" id="w">0</span></div>
  <div class="minus"></div>
  <div class="box" id="lb"><span class="num" id="l">0</span></div>
</div>
<script>
  const BASE = location.protocol === 'file:' ? 'http://localhost:3000' : '';
  const $ = id => document.getElementById(id);
  let first = true;

  function update(id, value) {
    const num = $(id), box = $(id + 'b');
    if (num.textContent === String(value)) return;
    num.textContent = value;
    if (first) return; // no animation for the initial load
    for (const el of [num, box]) { el.classList.remove(el === num ? 'tick' : 'flash'); void el.offsetWidth; }
    num.classList.add('tick');
    box.classList.add('flash');
  }

  new EventSource(BASE + '/events').onmessage = e => {
    const s = JSON.parse(e.data);
    update('w', s.wins);
    update('l', s.losses);
    first = false;
  };
</script>
</body>
</html>
