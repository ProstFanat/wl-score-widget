<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="transparent">
<title>Halloween Camera Frame</title>
<style>
  :root {
    color-scheme:dark;
    --orange:#ff7a24;
    --gold:#ffc15b;
    --ember:#ff4d16;
    --violet:#a855f7;
  }
  * { box-sizing:border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; }
  .frame { position:relative; width:100vw; height:100vh; overflow:hidden; }
  .edge { position:absolute; z-index:1; filter:drop-shadow(0 0 7px rgba(255,105,24,.58)); }
  .edge.top,.edge.bottom { left:7%; width:86%; height:24px; }
  .edge.top { top:4%; }
  .edge.bottom { bottom:2.2%; transform:rotate(180deg); }
  .edge.left,.edge.right { top:9%; width:24px; height:82%; }
  .edge.left { left:2.2%; transform:rotate(-90deg); transform-origin:top left; width:82vh; height:24px; top:91%; }
  .edge.right { right:2.2%; transform:rotate(90deg); transform-origin:top right; width:82vh; height:24px; top:91%; }
  .corner { position:absolute; z-index:3; width:clamp(94px,15vw,240px); aspect-ratio:1; overflow:visible; }
  .corner.tl { top:0; left:0; }
  .corner.tr { top:0; right:0; transform:scaleX(-1); }
  .corner.bl { bottom:0; left:0; }
  .corner.br { right:0; bottom:0; transform:scaleX(-1); }
  .corner-art { overflow:visible; }
  .corner-glow { transform-box:fill-box; transform-origin:center; animation:lantern-glow 3.6s ease-in-out infinite; }
  .holiday-pumpkins { position:absolute; z-index:4; right:1.5%; bottom:0.0009%; width:clamp(100px,18vw,220px); height:auto; pointer-events:none; }
  .bat { position:absolute; z-index:2; width:clamp(22px,3vw,46px); color:#24142c; filter:drop-shadow(0 0 5px rgba(255,129,44,.6)); animation:bat-flight 8s ease-in-out infinite; }
  .bat.one { top:12%; left:31%; }
  .bat.two { top:22%; right:29%; width:clamp(16px,2vw,32px); animation-delay:-3.4s; animation-duration:10s; }
  .bat.three { bottom:15%; left:42%; width:clamp(18px,2.3vw,36px); animation-delay:-5.2s; animation-duration:9s; }
  .web { position:absolute; z-index:1; width:clamp(52px,9vw,140px); opacity:.58; filter:drop-shadow(0 0 5px rgba(255,145,70,.35)); }
  .web.tl { top:0; left:0; }
  .web.tr { top:0; right:0; transform:scaleX(-1); }
  .web.bl { bottom:0; left:0; transform:scaleY(-1); }
  .web.br { right:0; bottom:0; transform:scale(-1); }
  .spark { position:absolute; z-index:2; width:4px; height:4px; border-radius:50%; background:#ffc15b; box-shadow:0 0 10px 3px rgba(255,123,36,.8); animation:ember-rise 5s linear infinite; }
  .spark.s1 { left:23%; bottom:8%; }
  .spark.s2 { left:76%; bottom:12%; animation-delay:-2s; animation-duration:6.4s; }
  .spark.s3 { left:59%; bottom:5%; animation-delay:-3.1s; animation-duration:5.6s; }
  .frame-line { position:absolute; inset:2.2%; border:1px solid rgba(255,139,52,.56); border-radius:clamp(18px,3vw,44px); box-shadow:inset 0 0 22px rgba(255,103,24,.08),0 0 20px rgba(255,93,20,.14); animation:frame-pulse 4s ease-in-out infinite; }
  .frame-line::before { position:absolute; inset:7px; border:1px solid rgba(255,193,91,.24); border-radius:inherit; content:""; }
  @keyframes lantern-glow { 0%,100% { opacity:.9; filter:drop-shadow(0 0 6px rgba(255,104,24,.42)); } 48% { opacity:1; filter:drop-shadow(0 0 18px rgba(255,122,36,.9)); } 53% { opacity:.78; } 58% { opacity:1; } }
  @keyframes frame-pulse { 0%,100% { border-color:rgba(255,139,52,.44); box-shadow:inset 0 0 15px rgba(255,103,24,.04),0 0 14px rgba(255,93,20,.1); } 50% { border-color:rgba(255,164,68,.8); box-shadow:inset 0 0 30px rgba(255,103,24,.09),0 0 28px rgba(255,93,20,.28); } }
  @keyframes bat-flight { 0%,100% { transform:translate(0,0) rotate(-4deg); } 25% { transform:translate(24px,-12px) rotate(5deg); } 55% { transform:translate(48px,5px) rotate(-2deg); } 80% { transform:translate(22px,14px) rotate(6deg); } }
  @keyframes ember-rise { 0% { transform:translateY(0) translateX(0) scale(.5); opacity:0; } 15% { opacity:.95; } 80% { opacity:.85; } 100% { transform:translateY(-55vh) translateX(24px) scale(.1); opacity:0; } }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
</style>
