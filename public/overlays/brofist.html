<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brofist Score Overlay</title>
<style>
  @font-face {
    font-family:"Cruyff Sans";
    src:url("/assets/FONTS/CruyffSans-Bold.ecd5078c.otf") format("opentype");
    font-style:normal;
    font-weight:700;
    font-display:swap;
  }
  :root {
    color-scheme:dark;
    --green:#2f8bff;
    --red:#ffd500;
    --overlay-width:640px;
    --logo-w:130px;
    --fist-h:96px;
    --fist-w:calc(var(--fist-h) * .867);
  }
  html, body { margin:0; background:transparent; color:#fff; font-family:"Cruyff Sans","Arial Narrow",Arial,sans-serif; }
  .wrap { display:inline-block; padding:44px 24px; }
  .card {
    position:relative;
    box-sizing:border-box;
    width:min(var(--overlay-width),calc(100vw - 32px));
    padding:8px 20px 12px;
    isolation:isolate;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.4));
  }
  .bg {
    position:absolute;
    z-index:-2;
    inset:0;
    overflow:hidden;
    background:linear-gradient(180deg,rgba(6,16,38,.98),rgba(3,8,20,.98));
  }
  .bg::before {
    position:absolute;
    inset:0;
    background:linear-gradient(90deg,rgba(47,139,255,.08),transparent 30%,transparent 70%,rgba(255,213,0,.13));
    content:"";
  }
  .bg::before { animation:glow-breathe 6s ease-in-out infinite; }
  .pitch {
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg,rgba(6,16,38,.5),rgba(3,8,20,.62)),
      repeating-linear-gradient(90deg,#1f6e36 0 36px,#278040 36px 72px);
  }
  .pitch::before, .pitch::after { position:absolute; content:""; }
  .pitch::before { top:0; bottom:0; left:50%; width:2px; margin-left:-1px; background:rgba(255,255,255,.22); }
  .pitch::after { top:50%; left:50%; width:110px; height:110px; margin:-55px 0 0 -55px; border:2px solid rgba(255,255,255,.22); border-radius:50%; }
  .ball-lane { position:absolute; left:0; right:0; bottom:10px; height:26px; pointer-events:none; }
  .ball {
    position:absolute;
    bottom:0;
    left:-30px;
    width:28px;
    height:28px;
    animation:ball-run 9s linear infinite;
  }
  .ball img { display:block; width:100%; height:100%; filter:drop-shadow(0 3px 2px rgba(0,0,0,.55)); animation:ball-spin 1.1s linear infinite; }
  @keyframes ball-run {
    0% { left:-30px; transform:translateY(0); }
    10%,30%,50%,70%,90% { transform:translateY(-5px); }
    20%,40%,60%,80% { transform:translateY(0); }
    100% { left:calc(100% + 6px); transform:translateY(0); }
  }
  @keyframes ball-spin { to { transform:rotate(360deg); } }
  .line-motion {
    position:absolute;
    inset:0;
    background:linear-gradient(45deg,transparent 46%,rgba(255,255,255,.05) 50%,transparent 54%);
    background-size:22px 22px;
    animation:texture-drift 5s linear infinite;
  }
  .line-motion::after {
    position:absolute;
    top:-40%;
    bottom:-40%;
    left:-20%;
    width:90px;
    background:linear-gradient(90deg,transparent,rgba(255,214,128,.18),transparent);
    content:"";
    transform:skewX(-22deg);
    animation:sweep 7s ease-in-out infinite;
  }
  .fists { position:absolute; inset:0; pointer-events:none; }
  .fist {
    position:absolute;
    top:50%;
    width:var(--fist-w);
    height:var(--fist-h);
    margin-top:calc(var(--fist-h) / -2);
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));
  }
  .fist img { display:block; width:100%; height:100%; transform:rotate(var(--tilt,48deg)); }
  .fist.left { left:calc(50% - var(--fist-w) + 1px); animation:fist-left 30s linear var(--loop-delay,-25s) infinite; }
  .fist.right { right:calc(50% - var(--fist-w) + 1px); animation:fist-right 30s linear var(--loop-delay,-25s) infinite; }
  .fist.right img { transform:scaleX(-1) rotate(var(--tilt,48deg)); }
  .impact {
    position:absolute;
    top:50%;
    left:50%;
    width:120px;
    height:120px;
    margin:-60px 0 0 -60px;
    border:3px solid rgba(255,213,0,.75);
    border-radius:50%;
    opacity:0;
    animation:impact 30s ease-out var(--loop-delay,-25s) infinite;
  }
  .impact.two { animation-delay:calc(var(--loop-delay,-25s) + .15s); border-color:rgba(47,139,255,.8); }
  .flash {
    position:absolute;
    top:50%;
    left:50%;
    width:150px;
    height:150px;
    margin:-75px 0 0 -75px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,246,200,.95),rgba(255,213,0,.45) 40%,transparent 70%);
    opacity:0;
    animation:flash 30s ease-out var(--loop-delay,-25s) infinite;
  }
  .edge { position:absolute; z-index:-1; inset:0; pointer-events:none; }
  .edge.win {
    background:var(--green);
    width:6px;right:auto;
    filter:drop-shadow(0 0 6px rgba(47,139,255,.6));
  }
  .edge.loss {
    background:var(--red);
    width:6px;left:auto;
    filter:drop-shadow(0 0 6px rgba(255,213,0,.6));
  }
  .scoreline {
    display:grid;
    grid-template-columns:1fr var(--logo-w) 1fr;
    align-items:center;
    min-height:64px;
  }
  .side { display:grid; place-items:center; min-width:0; }
  .side > * { grid-area:1 / 1; }
  .side.loss { grid-column:3; }
  .number {
    display:block;
    font-size:60px;
    font-weight:900;
    line-height:1;
    text-shadow:0 2px 8px rgba(0,0,0,.75);
  }
  .progress-row {
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,.5fr) var(--logo-w) minmax(0,.5fr) repeat(7,minmax(0,1fr));
    gap:4px;
    margin:12px 0 0;
    align-items:center;
    --seg-h:4px;
  }
  .progress-segment {
    height:var(--seg-h);
    background:rgba(230,239,239,.28);
  }
  .progress-segment:nth-child(8) { display:contents; }
  .progress-segment:nth-child(8)::before,
  .progress-segment:nth-child(8)::after {
    height:var(--seg-h);
    background:rgba(230,239,239,.28);
    content:"";
  }
  .progress-segment:nth-child(8)::before { grid-column:8; }
  .progress-segment:nth-child(8)::after { grid-column:10; }
  .progress-segment:nth-child(8).win::before, .progress-segment:nth-child(8).win::after { background:linear-gradient(var(--green),var(--green)) left center / 100% 100% no-repeat, rgba(230,239,239,.28); }
  .progress-segment:nth-child(8).loss::before, .progress-segment:nth-child(8).loss::after { background:linear-gradient(var(--red),var(--red)) left center / 100% 100% no-repeat, rgba(230,239,239,.28); }
  .progress-segment.win { background:linear-gradient(var(--green),var(--green)) left center / 100% 100% no-repeat, rgba(230,239,239,.28); }
  .progress-segment.loss { background:linear-gradient(var(--red),var(--red)) left center / 100% 100% no-repeat, rgba(230,239,239,.28); }
  .progress-segment.fresh { animation:seg-fill .6s ease-out both; }
  .progress-segment:nth-child(8).fresh { animation:none; }
  .progress-segment:nth-child(8).fresh::before { animation:seg-fill .3s ease-out both; }
  .progress-segment:nth-child(8).fresh::after { animation:seg-fill .3s ease-out .3s both; }
  @keyframes seg-fill { from { background-size:0% 100%, auto; } to { background-size:100% 100%, auto; } }
  .number { transition:opacity .18s ease, transform .18s ease; }
  .number.out { opacity:0; transform:scale(.6); }
  .number.tick { animation:score-pop .48s cubic-bezier(.2,1.35,.35,1); }
  .word {
    font-size:44px;
    font-weight:900;
    letter-spacing:3px;
    line-height:1;
    opacity:0;
    pointer-events:none;
  }
  .word.win { color:var(--green); text-shadow:0 0 16px rgba(47,139,255,.8),0 2px 8px rgba(0,0,0,.75); }
  .word.loss { color:var(--red); text-shadow:0 0 16px rgba(255,213,0,.8),0 2px 8px rgba(0,0,0,.75); }
  .word.show { animation:word-pop 1s cubic-bezier(.2,1.2,.3,1) .45s both; }
  @keyframes word-pop {
    0% { opacity:0; transform:scale(.4) translateY(10px); }
    25% { opacity:1; transform:scale(1.15) translateY(0); }
    70% { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(1.25); }
  }
  @keyframes sweep { 0% { left:-20%; opacity:0; } 10% { opacity:1; } 55% { left:110%; opacity:1; } 60%,100% { left:110%; opacity:0; } }
  @keyframes texture-drift { from { background-position:0 0; } to { background-position:22px 0; } }
  @keyframes glow-breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  /* 30s cycle: fists rest at the centre for most of it. In the last 10% they run
     out to the sides, the centre stays empty, then they run back in, hit at 96%
     and stay. A score event restarts the cycle, so the two never overlap. */
  @keyframes fist-left {
    0%,90% { left:calc(50% - var(--fist-w) + 1px); animation-timing-function:ease-in; }
    91.5%,92.5% { left:calc(var(--fist-w) * -1.2); animation-timing-function:cubic-bezier(.5,0,.8,.6); }
    96% { left:calc(50% - var(--fist-w) + 6px); animation-timing-function:ease-out; }
    96.8%,100% { left:calc(50% - var(--fist-w) + 1px); }
  }
  @keyframes fist-right {
    0%,90% { right:calc(50% - var(--fist-w) + 1px); animation-timing-function:ease-in; }
    91.5%,92.5% { right:calc(var(--fist-w) * -1.2); animation-timing-function:cubic-bezier(.5,0,.8,.6); }
    96% { right:calc(50% - var(--fist-w) + 6px); animation-timing-function:ease-out; }
    96.8%,100% { right:calc(50% - var(--fist-w) + 1px); }
  }
  @keyframes impact { 0%,95.9% { transform:scale(.4); opacity:0; } 96.1% { transform:scale(.6); opacity:.9; } 100% { transform:scale(6); opacity:0; } }
  @keyframes flash { 0%,95.9% { transform:scale(.3); opacity:0; } 96.3% { transform:scale(1.1); opacity:1; } 98.5%,100% { transform:scale(1.8); opacity:0; } }
  /* Score events: the fist on the scoring side runs out while the WIN/LOSS word
     shows, then returns with a ring. The animation is added next to the 30s
     loop (same name, same duration), so the loop keeps its own timeline. */
  .fist.left.hit { animation:fist-left 30s linear var(--loop-delay,-25s) infinite, fist-left-hit 2.1s linear; }
  .fist.right.hit { animation:fist-right 30s linear var(--loop-delay,-25s) infinite, fist-right-hit 2.1s linear; }
  .ring, .ring-flash { position:absolute; top:50%; left:50%; opacity:0; border-radius:50%; }
  .ring { width:120px; height:120px; margin:-60px 0 0 -60px; border:3px solid; }
  .ring-flash { width:150px; height:150px; margin:-75px 0 0 -75px; }
  .ring.win { border-color:rgba(47,139,255,.85); }
  .ring.loss { border-color:rgba(255,213,0,.85); }
  .ring-flash.win { background:radial-gradient(circle,rgba(190,220,255,.95),rgba(47,139,255,.45) 40%,transparent 70%); }
  .ring-flash.loss { background:radial-gradient(circle,rgba(255,246,200,.95),rgba(255,213,0,.45) 40%,transparent 70%); }
  .ring.go { animation:ring-go .7s ease-out 1.95s forwards; }
  .ring-flash.go { animation:ring-flash-go .45s ease-out 1.95s forwards; }
  @keyframes fist-left-hit {
    0% { left:calc(50% - var(--fist-w) + 1px); animation-timing-function:ease-in; }
    21%,71% { left:10px; animation-timing-function:cubic-bezier(.5,0,.8,.6); }
    93% { left:calc(50% - var(--fist-w) + 6px); animation-timing-function:ease-out; }
    100% { left:calc(50% - var(--fist-w) + 1px); }
  }
  @keyframes fist-right-hit {
    0% { right:calc(50% - var(--fist-w) + 1px); animation-timing-function:ease-in; }
    21%,71% { right:10px; animation-timing-function:cubic-bezier(.5,0,.8,.6); }
    93% { right:calc(50% - var(--fist-w) + 6px); animation-timing-function:ease-out; }
    100% { right:calc(50% - var(--fist-w) + 1px); }
  }
  @keyframes ring-go { from { transform:scale(.6); opacity:.9; } to { transform:scale(6); opacity:0; } }
  @keyframes ring-flash-go { 0% { transform:scale(.3); opacity:0; } 25% { transform:scale(1.1); opacity:1; } 100% { transform:scale(1.8); opacity:0; } }
  @keyframes score-pop {
    0% { transform:translateY(-16px) scale(1.2); opacity:0; }
    100% { transform:translateY(0) scale(1); opacity:1; }
  }
  @media (max-width:500px) {
    .wrap { padding:32px 16px; }
    .card { padding:6px 12px 10px; }
    :root { --logo-w:100px; --fist-h:78px; }
    .progress-row { gap:2px; }
    .progress-row { --seg-h:3px; margin:8px 0 0; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="card" id="card" aria-label="FUT Champions wins and losses">
    <div class="bg" aria-hidden="true"><span class="pitch"></span><span class="line-motion"></span><span class="ball-lane"><span class="ball"><img src="/assets/brofist/ball.png" alt=""></span></span>
      <div class="fists"><span class="flash"></span><span class="impact"></span><span class="impact two"></span><span class="fist left"><img src="/assets/brofist/fist.png" alt=""></span><span class="fist right"><img src="/assets/brofist/fist.png" alt=""></span><span class="ring-flash win" id="w-flash"></span><span class="ring win" id="w-ring"></span><span class="ring-flash loss" id="l-flash"></span><span class="ring loss" id="l-ring"></span></div>
    </div>
    <span class="edge win" aria-hidden="true"></span>
    <span class="edge loss" aria-hidden="true"></span>
    <div class="scoreline">
      <div class="side wins"><span class="number" id="w">0</span><span class="word win" id="w-word">WIN</span></div>
      <div class="side loss"><span class="number" id="l">0</span><span class="word loss" id="l-word">LOSS</span></div>
    </div>
    <div class="progress-row" id="progress" role="group" aria-label="Match results"></div>
  </section>
</div>
<script>
  const BASE = location.protocol === 'file:' ? 'http://localhost:3000' : '';
  const progress = document.getElementById('progress');
  const progressSegments = 15;

  for (let i = 0; i < progressSegments; i++) {
    const segment = document.createElement('span');
    segment.className = 'progress-segment';
    progress.appendChild(segment);
  }

  // Whole-pixel, equal-width segments: fractional fr tracks render some
  // segments 1px wider than others, which shows as a ragged line when resized.
  const logoProbe = document.createElement('div');
  logoProbe.style.cssText = 'position:absolute;visibility:hidden;width:var(--logo-w)';
  document.body.appendChild(logoProbe);
  function layoutProgress() {
    const available = progress.clientWidth;
    const logo = Math.round(logoProbe.getBoundingClientRect().width);
    const minGap = window.matchMedia('(max-width:500px)').matches ? 2 : 4;
    let segment = Math.floor((available - logo - 16 * minGap) / progressSegments);
    segment -= segment % 2;
    if (segment < 2) return;
    const gap = Math.floor((available - logo - progressSegments * segment) / 16);
    progress.style.gridTemplateColumns = `repeat(7,${segment}px) ${segment / 2}px ${logo}px ${segment / 2}px repeat(7,${segment}px)`;
    progress.style.columnGap = `${gap}px`;
    progress.style.justifyContent = 'center';
  }
  new ResizeObserver(layoutProgress).observe(progress);
  layoutProgress();

  let first = true;
  let shownHistory = [];

  const FIST_MS = 450;
  const WORD_MS = FIST_MS + 1000;
  const timers = {};

  function setNumber(number, value) {
    number.textContent = value;
    number.classList.remove('out', 'tick');
    void number.offsetWidth;
    number.classList.add('tick');
  }

  function fistEvent(id) {
    const fist = document.querySelector(id === 'w' ? '.fist.left' : '.fist.right');
    const els = [fist, document.getElementById(id + '-ring'), document.getElementById(id + '-flash')];
    els.forEach(el => el.classList.remove(el === fist ? 'hit' : 'go'));
    // A leftover .hit on the other fist would replay its run-out when the loop restarts.
    document.querySelectorAll('.fist.hit').forEach(el => el.classList.remove('hit'));
    // Restart the 30s cycle from this moment so the loop never fires on top of the event.
    const fists = document.querySelector('.fists');
    const loopEls = fists.querySelectorAll('.fist, .impact, .flash');
    fists.style.setProperty('--loop-delay', '0s');
    loopEls.forEach(el => { el.style.animation = 'none'; });
    void fist.offsetWidth;
    loopEls.forEach(el => { el.style.animation = ''; });
    els.forEach(el => el.classList.add(el === fist ? 'hit' : 'go'));
  }

  function updateScore(id, value) {
    const number = document.getElementById(id);
    const word = document.getElementById(id + '-word');
    const previous = Number(number.dataset.value ?? number.textContent);
    number.dataset.value = String(value);
    clearTimeout(timers[id]);
    clearTimeout(timers[id + 'out']);
    word.classList.remove('show');
    if (first || value <= previous) {
      number.classList.remove('out', 'tick');
      number.textContent = value;
      return;
    }
    clearTimeout(timers[id + 'out']);
    timers[id + 'out'] = setTimeout(() => number.classList.add('out'), FIST_MS);
    fistEvent(id);
    void word.offsetWidth;
    word.classList.add('show');
    timers[id] = setTimeout(() => {
      word.classList.remove('show');
      setNumber(number, number.dataset.value);
    }, WORD_MS);
  }

  function render(state) {
    updateScore('w', state.wins);
    updateScore('l', state.losses);
    const total = state.wins + state.losses;
    const history = Array.isArray(state.history) && state.history.length === total
      ? state.history
      : [...'W'.repeat(state.wins), ...'L'.repeat(state.losses)];
    [...progress.children].forEach((segment, index) => {
      const result = history[index];
      const isNew = !first && result && !shownHistory[index];
      if (!result) segment.classList.remove('fresh');
      if (isNew) {
        segment.classList.remove('fresh');
        void segment.offsetWidth;
        segment.classList.add('fresh');
      }
      segment.classList.toggle('win', result === 'W');
      segment.classList.toggle('loss', result === 'L');
      segment.title = result === 'W' ? `Match ${index + 1}: Win` : result === 'L' ? `Match ${index + 1}: Loss` : `Match ${index + 1}: Not played`;
    });
    shownHistory = [...history];
    first = false;
  }

  const roomMatch = location.pathname.match(/^\/room\/([a-f0-9]{32})\//);
  const isPreview = new URLSearchParams(location.search).get('preview') === '1' || location.pathname.startsWith('/preview/');

  if (isPreview) {
    if (window.self === window.top) {
      const homeLink = document.createElement('a');
      homeLink.href = '/';
      homeLink.textContent = '← Scoreboard Studio';
      homeLink.style.cssText = 'position:fixed;top:10px;left:12px;color:#fff;font:700 11px "Cruyff Sans",Arial,sans-serif;text-decoration:none';
      document.body.appendChild(homeLink);
    }
    render({ wins:5, losses:4, history:[...'WLWWLWWLL'], max:15 });
  } else {
    new EventSource(roomMatch ? `/room/${roomMatch[1]}/events` : BASE + '/default/events').onmessage = event => render(JSON.parse(event.data));
  }
</script>
</body>
</html>
