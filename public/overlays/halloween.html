<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halloween Score Overlay</title>
<style>
  :root {
    color-scheme:dark;
    --orange:#ff8733;
    --orange-bright:#ffd09a;
    --violet:#bd83ff;
    --muted:#b1a0bd;
    --overlay-width:400px;
  }
  html, body { margin:0; background:transparent; color:#fff8f1; font-family:"Segoe UI",Helvetica,Arial,sans-serif; }
  .wrap { display:inline-block; padding:20px; }
  .card {
    position:relative;
    box-sizing:border-box;
    width:min(var(--overlay-width),calc(100vw - 24px));
    overflow:hidden;
    padding:15px 20px 13px;
    border:3px solid rgba(255,135,51,.7);
    border-radius:15px;
    background:transparent;
    box-shadow:0 0 18px rgba(255,105,26,.12);
    animation:border-glow 4s ease-in-out infinite;
  }
  .card::before {
    position:absolute;
    inset:5px;
    border:3px solid rgba(255,255,255,.07);
    border-radius:10px;
    content:"";
    pointer-events:none;
  }
  .card::after {
    position:absolute;
    top:0;
    right:0;
    width:48%;
    height:2px;
    background:linear-gradient(90deg,transparent,var(--violet),var(--orange-bright));
    content:"";
    opacity:.95;
  }
  .scoreline { display:grid; grid-template-columns:1fr 54px 1fr; align-items:center; }
  .pumpkin {
    display:block;
    width:48px;
    height:44px;
    margin:auto;
    filter:drop-shadow(0 0 9px rgba(255,117,37,.48));
    animation:haunt 5s ease-in-out infinite;
  }
  .side { display:flex; align-items:center; gap:9px; }
  .side.loss { justify-content:flex-end; }
  .number { color:var(--orange-bright); font-size:43px; font-weight:850; line-height:.95; letter-spacing:-2px; text-shadow:0 0 18px rgba(255,135,51,.32); }
  .loss .number { color:#f3eaff; text-shadow:0 0 18px rgba(189,131,255,.27); }
  .separator { display:flex; align-items:center; justify-content:center; }
  .progress-row { display:flex; align-items:center; gap:9px; margin-top:11px; }
  .segments { display:grid; flex:1; grid-template-columns:repeat(15,1fr); gap:4px; }
  .segment { height:3px; border-radius:3px; background:rgba(236,220,244,.7); }
  .segment.win { background:linear-gradient(90deg,#9be86f,#e2ffad); box-shadow:0 0 7px rgba(155,232,111,.9); }
  .segment.loss { background:linear-gradient(90deg,#b766ff,#f0b6ff); box-shadow:0 0 7px rgba(189,131,255,.9); }
  .number.tick { animation:score-pop .48s cubic-bezier(.2,1.35,.35,1); }
  .card.flash { animation:border-glow 4s ease-in-out infinite,card-flash .55s ease-out; }
  @keyframes border-glow {
    0%,100% { border-color:rgba(255,135,51,.52); box-shadow:0 0 12px rgba(255,105,26,.08); }
    50% { border-color:#ffb14b; box-shadow:0 0 24px rgba(255,135,51,.4); }
  }
  @keyframes score-pop { 0% { transform:translateY(-16px) scale(1.2); opacity:0; } 100% { transform:translateY(0) scale(1); opacity:1; } }
  @keyframes card-flash { 45% { filter:brightness(1.65); box-shadow:0 0 34px rgba(255,119,44,.4); } }
  @keyframes haunt { 0%,100% { transform:rotate(0) translateY(0); } 45% { transform:rotate(-4deg) translateY(-2px); } 70% { transform:rotate(3deg) translateY(1px); } }
  @media (max-width:500px) {
    .wrap { padding:12px; }
    .card { padding:13px; }
    .scoreline { grid-template-columns:1fr 44px 1fr; }
    .side { gap:6px; }
    .number { font-size:35px; }
    .segments { gap:2px; }
    .pumpkin { width:38px; height:35px; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="card" id="card" aria-label="Halloween wins and losses">
    <div class="scoreline">
      <div class="side"><span class="number" id="w">0</span></div>
      <span class="separator">
        <svg class="pumpkin" viewBox="0 0 64 56" role="img" aria-label="Glowing jack-o'-lantern">
          <defs>
            <linearGradient id="gourd" x1="12" y1="11" x2="51" y2="47" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ffbd56"/><stop offset=".48" stop-color="#ff812b"/><stop offset="1" stop-color="#c74416"/>
            </linearGradient>
            <linearGradient id="glow" x1="25" y1="24" x2="39" y2="41" gradientUnits="userSpaceOnUse">
              <stop stop-color="#fff4a3"/><stop offset="1" stop-color="#ffb42e"/>
            </linearGradient>
          </defs>
          <path d="M31 13c-1-5 1-9 5-11 2 4 1 7-2 10l-1 3" fill="#72934c" stroke="#a8b867" stroke-width="1.5"/>
          <path d="M32 14c-5-6-15-3-18 3-9 1-12 9-10 18 2 11 12 17 28 17s26-6 28-17c2-9-1-17-10-18-4-6-13-9-18-3Z" fill="url(#gourd)" stroke="#ffb14b" stroke-width="1.5"/>
          <path d="M32 14c-4 7-4 27 0 38M17 18c-5 8-5 22 1 29M47 18c5 8 5 22-1 29" fill="none" stroke="#a83c1b" stroke-opacity=".55" stroke-width="2"/>
          <path d="m15 25 13 3-7 8-6-11Zm34 0-13 3 7 8 6-11Z" fill="url(#glow)"/>
          <path d="m24 41 5-3 3 3 4-3 7 3-4 5H28l-4-5Z" fill="url(#glow)"/>
          <path d="m29 39 1 5m8-5-1 5" stroke="#a83c1b" stroke-width="1.2"/>
          <path d="M13 20c-3-2-5-1-7 1m45-1c3-2 5-1 7 1" fill="none" stroke="#ffcb70" stroke-linecap="round" stroke-width="1.5"/>
        </svg>
      </span>
      <div class="side loss">
        <span class="number" id="l">0</span>
      </div>
    </div>
    <div class="progress-row">
      <div class="segments" id="segments" aria-label="Match result history"></div>
    </div>
  </section>
</div>
<script>
  const BASE = location.protocol === 'file:' ? 'http://localhost:3000' : '';
  const segments = document.getElementById('segments');
  for (let i = 0; i < 15; i++) {
    const segment = document.createElement('span');
    segment.className = 'segment';
    segments.appendChild(segment);
  }
  let first = true;

  function updateScore(id, value) {
    const number = document.getElementById(id);
    if (number.textContent === String(value)) return;
    number.textContent = value;
    if (first) return;
    number.classList.remove('tick');
    void number.offsetWidth;
    number.classList.add('tick');
    const card = document.getElementById('card');
    card.classList.remove('flash');
    void card.offsetWidth;
    card.classList.add('flash');
  }

  function render(state) {
    updateScore('w', state.wins);
    updateScore('l', state.losses);
    const total = state.wins + state.losses;
    const history = Array.isArray(state.history) && state.history.length === total
      ? state.history
      : [...'W'.repeat(state.wins), ...'L'.repeat(state.losses)];
    [...segments.children].forEach((segment, index) => {
      const result = history[index];
      segment.classList.toggle('win', result === 'W');
      segment.classList.toggle('loss', result === 'L');
      segment.title = result === 'W' ? `Match ${index + 1}: Win` : result === 'L' ? `Match ${index + 1}: Loss` : `Match ${index + 1}: Not played`;
    });
    first = false;
  }

  if (new URLSearchParams(location.search).get('preview') === '1') {
    if (window.self === window.top) {
      const homeLink = document.createElement('a');
      homeLink.href = '/';
      homeLink.textContent = '← Scoreboard Studio';
      homeLink.style.cssText = 'position:fixed;top:10px;left:12px;color:#ffd09a;font:700 11px Segoe UI,Arial,sans-serif;text-decoration:none';
      document.body.appendChild(homeLink);
    }
    render({ wins:5, losses:4, history:[...'WLWWLWWLL'], max:15 });
  } else {
    new EventSource(BASE + '/halloween/events').onmessage = event => render(JSON.parse(event.data));
  }
</script>
</body>
</html>
