<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeiwStar Score Overlay</title>
<style>
  @font-face {
    font-family:"Cruyff Sans";
    src:url("/assets/FONTS/CruyffSans-Bold.ecd5078c.otf") format("opentype");
    font-style:normal;
    font-weight:700;
    font-display:swap;
  }
  :root {
    color-scheme:dark;
    --win:#eaf2ff;
    --loss:#7f8fc4;
    --ink:#050824;
    --ice:#eaf4ff;
    --neon:#5b6cff;
    --violet:#8a4dff;
    --navy:#0c1440;
    --overlay-width:640px;
    --logo-w:260px;
    /* The neon lettering is already centred in the cropped logo. */
    --logo-drop:0px;
    --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .7  0 0 0 0 .82  0 0 0 0 1  0 0 0 .55 -.18'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  }
  html, body { margin:0; background:transparent; color:#fff; font-family:"Cruyff Sans","Arial Narrow",Arial,sans-serif; }
  .wrap { display:inline-block; padding:44px 24px; }
  .card {
    position:relative;
    box-sizing:border-box;
    width:min(var(--overlay-width),calc(100vw - 32px));
    padding:8px 20px 12px;
    isolation:isolate;
    animation:card-in .9s cubic-bezier(.2,1.2,.3,1) both;
  }
  .bg {
    position:absolute;
    z-index:-2;
    inset:0;
    overflow:hidden;
    border:3px solid #bcd2ff;
    border-radius:20px;
    background:radial-gradient(120% 140% at 50% 0%,#141c55,var(--navy) 40%,var(--ink) 75%);
    box-shadow:0 0 0 4px var(--ink),0 0 0 5px rgba(140,170,255,.55),0 12px 22px rgba(0,0,0,.55),0 0 26px rgba(91,108,255,.35),inset 0 0 18px rgba(110,140,255,.2);
    animation:outline-pulse 5s ease-in-out infinite;
  }
  /* Spray-paint grain that crawls slowly left to right (the tile is seamless). */
  .grain {
    position:absolute;
    inset:-20px;
    background:var(--grain);
    opacity:.16;
    mix-blend-mode:screen;
    animation:grain-drift 40s linear infinite;
  }
  /* Faint diagonal texture drifting left to right, as in the default overlay. */
  .lines {
    position:absolute;
    inset:0;
    background:linear-gradient(45deg,transparent 46%,rgba(170,200,255,.04) 50%,transparent 54%);
    background-size:22px 22px;
    animation:texture-drift 5s linear infinite;
  }
  /* One soft band of light travelling slowly across the card. */
  .shine {
    position:absolute;
    top:-20%;
    bottom:-20%;
    left:-35%;
    width:35%;
    background:linear-gradient(90deg,transparent,rgba(190,215,255,.1),transparent);
    transform:skewX(-20deg);
    animation:sweep 14s linear infinite;
  }
  /* Spray spatter freckles in the corners. */
  .spatter {
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 6% 22%,#dbe8ff 0 1.5px,transparent 2px),
      radial-gradient(circle at 9% 70%,#dbe8ff 0 1px,transparent 1.6px),
      radial-gradient(circle at 4% 48%,#dbe8ff 0 1px,transparent 1.6px),
      radial-gradient(circle at 94% 30%,#dbe8ff 0 1.5px,transparent 2px),
      radial-gradient(circle at 91% 76%,#dbe8ff 0 1px,transparent 1.6px),
      radial-gradient(circle at 96% 58%,#dbe8ff 0 1px,transparent 1.6px);
    opacity:.5;
    animation:spatter-sway 14s ease-in-out infinite alternate;
  }

  /* ---------- Winter: frost, twinkles and snowfall ---------- */
  .frost {
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 60% 45% at 0% 100%,rgba(150,185,255,.2),transparent 70%),
      radial-gradient(ellipse 60% 45% at 100% 100%,rgba(150,185,255,.2),transparent 70%),
      radial-gradient(ellipse 50% 35% at 0% 0%,rgba(150,185,255,.13),transparent 70%),
      radial-gradient(ellipse 50% 35% at 100% 0%,rgba(150,185,255,.13),transparent 70%);
    animation:frost-breathe 7s ease-in-out infinite alternate;
  }
  .twinkle { position:absolute; inset:0; }
  .twinkle i {
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 6px 2px rgba(150,180,255,.9);
    opacity:0;
    animation:twinkle 4s ease-in-out infinite;
  }
  .twinkle i:nth-child(1) { left:8%;  top:30%; animation-delay:.2s; }
  .twinkle i:nth-child(2) { left:22%; top:78%; animation-delay:1.4s; }
  .twinkle i:nth-child(3) { left:38%; top:18%; animation-delay:2.6s; }
  .twinkle i:nth-child(4) { left:63%; top:82%; animation-delay:.9s; }
  .twinkle i:nth-child(5) { left:78%; top:24%; animation-delay:3.1s; }
  .twinkle i:nth-child(6) { left:92%; top:66%; animation-delay:1.9s; }
  #snow { position:absolute; inset:0; width:100%; height:100%; }
  @keyframes frost-breathe { from { opacity:.65; } to { opacity:1; } }
  @keyframes twinkle {
    0%,100% { opacity:0; transform:scale(.4); }
    50% { opacity:1; transform:scale(1.3); }
  }
  .edge { position:absolute; z-index:-1; top:14px; bottom:14px; width:5px; border-radius:3px; }
  .edge.win { left:9px; background:var(--win); box-shadow:0 0 10px rgba(110,140,255,.95),0 0 3px #fff; animation:edge-flicker 6s linear infinite; }
  .edge.loss { right:9px; background:repeating-linear-gradient(180deg,var(--loss) 0 5px,transparent 5px 9px); box-shadow:0 0 8px rgba(138,77,255,.5); }
  .scoreline {
    position:relative;
    display:grid;
    grid-template-columns:1fr var(--logo-w) 1fr;
    align-items:center;
    min-height:118px;
  }
  .side { position:relative; display:grid; place-items:center; min-width:0; }
  .side > * { grid-area:1 / 1; }
  .side.loss { grid-column:3; }
  .number {
    display:block;
    font-size:72px;
    font-weight:900;
    line-height:1;
    -webkit-text-stroke:2px var(--ink);
    paint-order:stroke fill;
    color:var(--ice);
    text-shadow:0 0 14px rgba(110,140,255,.9),0 0 30px rgba(91,108,255,.5),3px 4px 0 rgba(0,0,0,.9);
    transition:opacity .18s ease, transform .18s ease;
  }
  .side.loss .number { color:#aebce8; text-shadow:0 0 10px rgba(138,77,255,.55),3px 4px 0 rgba(0,0,0,.9); }
  .number.out { opacity:0; transform:scale(.6) rotate(-6deg); }
  .number.tick { animation:score-pop .55s cubic-bezier(.2,1.35,.35,1); }
  .word {
    font-size:46px;
    font-weight:900;
    letter-spacing:3px;
    line-height:1;
    opacity:0;
    pointer-events:none;
    -webkit-text-stroke:2px var(--ink);
    paint-order:stroke fill;
  }
  .word.win { color:var(--ice); text-shadow:0 0 18px rgba(110,140,255,1),0 0 34px rgba(91,108,255,.7),3px 4px 0 rgba(0,0,0,.9); }
  .word.loss { color:#8f9fd6; text-shadow:0 0 14px rgba(138,77,255,.6),3px 4px 0 rgba(0,0,0,.9); }
  .word.show { animation:word-pop 1s cubic-bezier(.2,1.2,.3,1) both; }
  /* Paint splat that bursts behind the word when a point is scored. */
  .splat {
    width:110px;
    height:110px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(200,220,255,.8),rgba(91,108,255,.35) 45%,transparent 70%);
    opacity:0;
    pointer-events:none;
    z-index:-1;
  }
  .word.show ~ .splat { animation:splat 1s ease-out both; }
  .center {
    position:absolute;
    z-index:2;
    top:50%;
    left:50%;
    display:flex;
    width:var(--logo-w);
    align-items:center;
    justify-content:center;
    pointer-events:none;
    transform:translate(-50%,calc(-50% + var(--logo-drop)));
    animation:logo-float 5s ease-in-out infinite;
  }
  .logo {
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:780 / 366;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,.8)) drop-shadow(0 0 12px rgba(91,108,255,.6));
  }
  .center::after {
    position:absolute;
    inset:-6px -14px;
    background:linear-gradient(105deg,transparent 42%,rgba(210,225,255,.6) 50%,transparent 58%);
    -webkit-mask:url("/assets/deiwstar/title-wide.png") center / contain no-repeat;
    mask:url("/assets/deiwstar/title-wide.png") center / contain no-repeat;
    content:"";
    background-size:250% 100%;
    background-position:150% 0;
    animation:logo-shine 7s ease-in-out 1.2s infinite;
  }
  .progress-row {
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,.5fr) var(--logo-w) minmax(0,.5fr) repeat(7,minmax(0,1fr));
    gap:4px;
    margin:12px 0 0;
    align-items:center;
    --seg-h:5px;
  }
  .progress-segment {
    height:var(--seg-h);
    border-radius:1px;
    background:rgba(150,180,255,.2);
  }
  .progress-segment:nth-child(8) { display:contents; }
  .progress-segment:nth-child(8)::before,
  .progress-segment:nth-child(8)::after {
    height:var(--seg-h);
    border-radius:1px;
    background:rgba(150,180,255,.2);
    content:"";
  }
  .progress-segment:nth-child(8)::before { grid-column:8; }
  .progress-segment:nth-child(8)::after { grid-column:10; }
  .progress-segment { --paint:none; }
  .progress-segment.win, .progress-segment:nth-child(8).win::before, .progress-segment:nth-child(8).win::after {
    background:linear-gradient(90deg,#fff,#9fb4ff) left center / 100% 100% no-repeat, rgba(150,180,255,.2);
    box-shadow:0 0 8px rgba(110,140,255,.9);
  }
  .progress-segment.loss, .progress-segment:nth-child(8).loss::before, .progress-segment:nth-child(8).loss::after {
    background:repeating-linear-gradient(45deg,var(--loss) 0 3px,#161c4a 3px 6px) left center / 100% 100% no-repeat, rgba(150,180,255,.2);
  }
  .progress-segment:nth-child(8).win, .progress-segment:nth-child(8).loss { background:none; box-shadow:none; }
  .progress-segment.fresh { animation:seg-fill .6s ease-out both; }
  .progress-segment:nth-child(8).fresh { animation:none; }
  .progress-segment:nth-child(8).fresh::before { animation:seg-fill .3s ease-out both; }
  .progress-segment:nth-child(8).fresh::after { animation:seg-fill .3s ease-out .3s both; }
  @keyframes seg-fill { from { background-size:0% 100%, auto; } to { background-size:100% 100%, auto; } }
  @keyframes card-in { from { opacity:0; transform:translateY(-18px) scale(.94); } to { opacity:1; transform:none; } }
  @keyframes outline-pulse {
    0%,100% { box-shadow:0 0 0 4px var(--ink),0 0 0 5px rgba(140,170,255,.45),0 12px 22px rgba(0,0,0,.55),0 0 20px rgba(91,108,255,.25),inset 0 0 14px rgba(110,140,255,.12); }
    50% { box-shadow:0 0 0 4px var(--ink),0 0 0 5px rgba(170,195,255,.8),0 12px 22px rgba(0,0,0,.55),0 0 38px rgba(91,108,255,.6),inset 0 0 24px rgba(120,150,255,.26); }
  }
  @keyframes texture-drift { from { background-position:0 0; } to { background-position:22px 0; } }
  @keyframes grain-drift { from { background-position:0 0; } to { background-position:200px 0; } }
  @keyframes spatter-sway { from { transform:translateX(-5px); } to { transform:translateX(5px); } }
  @keyframes sweep { from { left:-35%; } to { left:110%; } }
  @keyframes edge-flicker { 0%,100% { opacity:1; } 91% { opacity:1; } 92% { opacity:.35; } 93% { opacity:1; } 95% { opacity:.5; } 96% { opacity:1; } }
  @keyframes logo-float {
    0%,100% { transform:translate(-50%,calc(-50% + var(--logo-drop))) rotate(-2deg); }
    50% { transform:translate(-50%,calc(-50% + var(--logo-drop) - 4px)) rotate(2deg); }
  }
  @keyframes logo-shine { 0% { background-position:150% 0; } 22%,100% { background-position:-50% 0; } }
  @keyframes score-pop {
    0% { transform:translateY(-18px) scale(1.3) rotate(-5deg); opacity:0; }
    100% { transform:none; opacity:1; }
  }
  @keyframes word-pop {
    0% { opacity:0; transform:scale(.4) rotate(-8deg) translateY(10px); }
    25% { opacity:1; transform:scale(1.18) rotate(3deg); }
    70% { opacity:1; transform:scale(1) rotate(-2deg); }
    100% { opacity:0; transform:scale(1.3) rotate(0); }
  }
  @keyframes splat {
    0% { opacity:0; transform:scale(.2); }
    20% { opacity:1; transform:scale(1.15); }
    100% { opacity:0; transform:scale(1.9); }
  }
  @media (max-width:500px) {
    .wrap { padding:32px 16px; }
    .card { padding:6px 12px 10px; }
    :root { --logo-w:170px; }
    .number { font-size:46px; }
    .scoreline { min-height:82px; }
    .progress-row { gap:2px; --seg-h:4px; margin:8px 0 0; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="card" id="card" aria-label="FUT Champions wins and losses">
    <div class="bg" aria-hidden="true">
      <span class="grain"></span><span class="lines"></span><span class="spatter"></span><span class="shine"></span>
      <span class="frost"></span><span class="twinkle"><i></i><i></i><i></i><i></i><i></i><i></i></span><canvas id="snow"></canvas>
    </div>
    <span class="edge win" aria-hidden="true"></span>
    <span class="edge loss" aria-hidden="true"></span>
    <div class="scoreline">
      <div class="side wins"><span class="number" id="w">0</span><span class="word win" id="w-word">WIN</span><span class="splat"></span></div>
      <div class="center">
        <img class="logo" src="/assets/deiwstar/title-wide.png" width="780" height="366" alt="DWS">
      </div>
      <div class="side loss"><span class="number" id="l">0</span><span class="word loss" id="l-word">LOSS</span><span class="splat"></span></div>
    </div>
    <div class="progress-row" id="progress" role="group" aria-label="Match results"></div>
  </section>
</div>
<script>
  const BASE = location.protocol === 'file:' ? 'http://localhost:3000' : '';
  const progress = document.getElementById('progress');
  const progressSegments = 15;

  for (let i = 0; i < progressSegments; i++) {
    const segment = document.createElement('span');
    segment.className = 'progress-segment';
    progress.appendChild(segment);
  }

  // Whole-pixel, equal-width segments: fractional fr tracks render some
  // segments 1px wider than others, which shows as a ragged line when resized.
  const logoProbe = document.createElement('div');
  logoProbe.style.cssText = 'position:absolute;visibility:hidden;width:var(--logo-w)';
  document.body.appendChild(logoProbe);
  function layoutProgress() {
    const available = progress.clientWidth;
    const logo = Math.round(logoProbe.getBoundingClientRect().width);
    const minGap = window.matchMedia('(max-width:500px)').matches ? 2 : 4;
    let segment = Math.floor((available - logo - 16 * minGap) / progressSegments);
    segment -= segment % 2;
    if (segment < 2) return;
    const gap = Math.floor((available - logo - progressSegments * segment) / 16);
    progress.style.gridTemplateColumns = `repeat(7,${segment}px) ${segment / 2}px ${logo}px ${segment / 2}px repeat(7,${segment}px)`;
    progress.style.columnGap = `${gap}px`;
    progress.style.justifyContent = 'center';
  }
  new ResizeObserver(layoutProgress).observe(progress);
  layoutProgress();


  // Gentle snowfall inside the card (canvas is clipped by .bg).
  (function snowfall() {
    const canvas = document.getElementById('snow');
    const ctx = canvas.getContext('2d');
    const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    let w = 0, h = 0, dpr = 1;
    const flakes = [];
    function resize() {
      dpr = window.devicePixelRatio || 1;
      w = canvas.clientWidth; h = canvas.clientHeight;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function spawn(initial) {
      const depth = Math.random();            // 0 = far/small, 1 = near/large
      return {
        x: Math.random() * w,
        y: initial ? Math.random() * h : -6,
        r: .8 + depth * 2.2,
        vy: 12 + depth * 28,                  // px per second
        sway: 6 + Math.random() * 14,
        phase: Math.random() * Math.PI * 2,
        a: .45 + depth * .5,
      };
    }
    new ResizeObserver(resize).observe(canvas);
    resize();
    const COUNT = 46;
    for (let i = 0; i < COUNT; i++) flakes.push(spawn(true));
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < flakes.length; i++) {
        const f = flakes[i];
        f.y += f.vy * dt;
        f.phase += dt * .9;
        const x = f.x + Math.sin(f.phase) * f.sway;
        if (f.y > h + 6) flakes[i] = spawn(false);
        ctx.beginPath();
        ctx.fillStyle = `rgba(225,238,255,${f.a})`;
        ctx.shadowColor = 'rgba(140,170,255,.9)';
        ctx.shadowBlur = f.r * 3;
        ctx.arc(x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      }
      if (!reduce) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();

  let first = true;
  let shownHistory = [];

  const WORD_MS = 1000;
  const timers = {};

  function setNumber(number, value) {
    number.textContent = value;
    number.classList.remove('out', 'tick');
    void number.offsetWidth;
    number.classList.add('tick');
  }

  function updateScore(id, value) {
    const number = document.getElementById(id);
    const word = document.getElementById(id + '-word');
    const previous = Number(number.dataset.value ?? number.textContent);
    number.dataset.value = String(value);
    clearTimeout(timers[id]);
    word.classList.remove('show');
    if (first || value <= previous) {
      number.classList.remove('out', 'tick');
      number.textContent = value;
      return;
    }
    number.classList.add('out');
    void word.offsetWidth;
    word.classList.add('show');
    timers[id] = setTimeout(() => {
      word.classList.remove('show');
      setNumber(number, number.dataset.value);
    }, WORD_MS);
  }

  function render(state) {
    updateScore('w', state.wins);
    updateScore('l', state.losses);
    const total = state.wins + state.losses;
    const history = Array.isArray(state.history) && state.history.length === total
      ? state.history
      : [...'W'.repeat(state.wins), ...'L'.repeat(state.losses)];
    [...progress.children].forEach((segment, index) => {
      const result = history[index];
      const isNew = !first && result && !shownHistory[index];
      if (!result) segment.classList.remove('fresh');
      if (isNew) {
        segment.classList.remove('fresh');
        void segment.offsetWidth;
        segment.classList.add('fresh');
      }
      segment.classList.toggle('win', result === 'W');
      segment.classList.toggle('loss', result === 'L');
      segment.title = result === 'W' ? `Match ${index + 1}: Win` : result === 'L' ? `Match ${index + 1}: Loss` : `Match ${index + 1}: Not played`;
    });
    shownHistory = [...history];
    first = false;
  }

  const roomMatch = location.pathname.match(/^\/room\/([a-f0-9]{32})\//);
  const isPreview = new URLSearchParams(location.search).get('preview') === '1' || location.pathname.startsWith('/preview/');

  if (isPreview) {
    if (window.self === window.top) {
      const homeLink = document.createElement('a');
      homeLink.href = '/';
      homeLink.textContent = '← Scoreboard Studio';
      homeLink.style.cssText = 'position:fixed;top:10px;left:12px;color:#fff;font:700 11px "Cruyff Sans",Arial,sans-serif;text-decoration:none';
      document.body.appendChild(homeLink);
    }
    render({ wins:5, losses:4, history:[...'WLWWLWWLL'], max:15 });
  } else {
    new EventSource(roomMatch ? `/room/${roomMatch[1]}/events` : BASE + '/default/events').onmessage = event => render(JSON.parse(event.data));
  }
</script>
</body>
</html>
