<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chupapi Score Overlay</title>
<style>
  @font-face {
    font-family:"Cruyff Sans";
    src:url("/assets/FONTS/CruyffSans-Bold.ecd5078c.otf") format("opentype");
    font-style:normal;
    font-weight:700;
    font-display:swap;
  }
  :root {
    color-scheme:dark;
    --green:#7dff8a;
    --red:#b57cff;
    --overlay-width:640px;
    --logo-w:130px;
  }
  html, body { margin:0; background:transparent; color:#fff; font-family:"Cruyff Sans","Arial Narrow",Arial,sans-serif; }
  .wrap { display:inline-block; padding:44px 24px; }
  .card {
    position:relative;
    box-sizing:border-box;
    width:min(var(--overlay-width),calc(100vw - 32px));
    padding:8px 20px 12px;
    isolation:isolate;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.4));
  }
  .bg {
    position:absolute;
    z-index:-2;
    inset:0;
    overflow:hidden;
    background:linear-gradient(180deg,rgba(6,22,30,.98),rgba(7,8,22,.98));
  }
  .bg::before {
    position:absolute;
    inset:0;
    background:linear-gradient(90deg,rgba(125,255,138,.09),transparent 30%,transparent 70%,rgba(181,124,255,.14));
    content:"";
  }
  .bg::before { animation:glow-breathe 6s ease-in-out infinite; }
  .mist {
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 40% 90% at 20% 80%,rgba(181,124,255,.18),transparent 70%),
      radial-gradient(ellipse 40% 90% at 80% 20%,rgba(125,255,138,.13),transparent 70%);
    background-size:200% 100%;
    animation:mist-drift 14s ease-in-out infinite alternate;
  }
  .web {
    position:absolute;
    inset:0;
    background:linear-gradient(45deg,transparent 46%,rgba(200,255,220,.06) 50%,transparent 54%);
    background-size:22px 22px;
    animation:texture-drift 6s linear infinite;
  }
  .sweep {
    position:absolute;
    top:-40%;
    bottom:-40%;
    left:-20%;
    width:90px;
    background:linear-gradient(90deg,transparent,rgba(125,255,138,.09),transparent);
    transform:skewX(-22deg);
    animation:sweep 7s ease-in-out infinite;
  }
  .pulse {
    position:absolute;
    top:50%;
    left:50%;
    width:120px;
    height:120px;
    margin:-60px 0 0 -60px;
    border:2px solid rgba(255,226,90,.42);
    border-radius:50%;
    opacity:0;
    animation:pulse 30s ease-out infinite;
  }
  .pulse.two { border-color:rgba(181,124,255,.45); animation-delay:1.5s; }
  .banana {
    display:block;
    width:100%;
    height:auto;
    filter:drop-shadow(0 0 7px rgba(255,226,90,.4));
  }
  .banana-rain { position:absolute; z-index:1; inset:0; overflow:hidden; pointer-events:none; }
  .banana-drop {
    position:absolute;
    top:-40px;
    left:var(--x);
    width:var(--size);
    opacity:var(--opacity);
    animation:banana-fall var(--duration) linear var(--delay) infinite;
  }
  .edge { position:absolute; z-index:-1; inset:0; pointer-events:none; }
  .edge.win {
    background:var(--green);
    width:6px;right:auto;
    filter:drop-shadow(0 0 6px rgba(155,232,111,.6));
  }
  .edge.loss {
    background:var(--red);
    width:6px;left:auto;
    filter:drop-shadow(0 0 6px rgba(189,131,255,.6));
  }
  .scoreline {
    display:grid;
    grid-template-columns:1fr var(--logo-w) 1fr;
    align-items:center;
    min-height:64px;
  }
  .side { display:grid; place-items:center; min-width:0; }
  .side > * { grid-area:1 / 1; }
  .side.loss { grid-column:3; }
  .number {
    display:block;
    font-size:60px;
    font-weight:900;
    line-height:1;
    text-shadow:0 2px 8px rgba(0,0,0,.75);
  }
  .champions-center {
    position:absolute;
    z-index:2;
    top:50%;
    left:50%;
    display:flex;
    width:var(--logo-w);
    height:140px;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    transform:translate(-50%,-50%);
  }
  .champions-logo {
    display:block;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    filter:drop-shadow(0 5px 5px rgba(0,0,0,.8));
    transform-style:preserve-3d;
    animation:logo-spin 30s linear infinite,logo-flicker 3.2s ease-in-out infinite;
  }
  .progress-row {
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,.5fr) var(--logo-w) minmax(0,.5fr) repeat(7,minmax(0,1fr));
    gap:4px;
    margin:12px 0 0;
    align-items:center;
    --seg-h:4px;
  }
  .progress-segment {
    height:var(--seg-h);
    background:rgba(230,239,239,.28);
  }
  .progress-segment:nth-child(8) { display:contents; }
  .progress-segment:nth-child(8)::before,
  .progress-segment:nth-child(8)::after {
    height:var(--seg-h);
    background:rgba(230,239,239,.28);
    content:"";
  }
  .progress-segment:nth-child(8)::before { grid-column:8; }
  .progress-segment:nth-child(8)::after { grid-column:10; }
  .progress-segment:nth-child(8).win::before, .progress-segment:nth-child(8).win::after { background:linear-gradient(var(--green),var(--green)) left center / 100% 100% no-repeat, rgba(230,239,239,.28); }
  .progress-segment:nth-child(8).loss::before, .progress-segment:nth-child(8).loss::after { background:linear-gradient(var(--red),var(--red)) left center / 100% 100% no-repeat, rgba(230,239,239,.28); }
  .progress-segment.win { background:linear-gradient(var(--green),var(--green)) left center / 100% 100% no-repeat, rgba(230,239,239,.28); }
  .progress-segment.loss { background:linear-gradient(var(--red),var(--red)) left center / 100% 100% no-repeat, rgba(230,239,239,.28); }
  .progress-segment.fresh { animation:seg-fill .6s ease-out both; }
  .progress-segment:nth-child(8).fresh { animation:none; }
  .progress-segment:nth-child(8).fresh::before { animation:seg-fill .3s ease-out both; }
  .progress-segment:nth-child(8).fresh::after { animation:seg-fill .3s ease-out .3s both; }
  @keyframes seg-fill { from { background-size:0% 100%, auto; } to { background-size:100% 100%, auto; } }
  .number { transition:opacity .18s ease, transform .18s ease; }
  .number.out { opacity:0; transform:scale(.6); }
  .wins .number { color:#e4ffe7; }
  .loss .number { color:#f1e6ff; }
  .number.tick { animation:score-pop .48s cubic-bezier(.2,1.35,.35,1); }
  .word {
    font-size:44px;
    font-weight:900;
    letter-spacing:3px;
    line-height:1;
    opacity:0;
    pointer-events:none;
  }
  .word.win { color:var(--green); text-shadow:0 0 16px rgba(125,255,138,.8),0 2px 8px rgba(0,0,0,.75); }
  .word.loss { color:var(--red); text-shadow:0 0 16px rgba(181,124,255,.8),0 2px 8px rgba(0,0,0,.75); }
  .word.show { animation:word-pop 1s cubic-bezier(.2,1.2,.3,1) both; }
  @keyframes word-pop {
    0% { opacity:0; transform:scale(.4) translateY(10px); }
    25% { opacity:1; transform:scale(1.15) translateY(0); }
    70% { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(1.25); }
  }
  @keyframes sweep { 0% { left:-20%; opacity:0; } 10% { opacity:1; } 55% { left:110%; opacity:1; } 60%,100% { left:110%; opacity:0; } }
  @keyframes texture-drift { from { background-position:0 0; } to { background-position:22px 0; } }
  @keyframes mist-drift { from { background-position:0 0; } to { background-position:60% 0; } }
  @keyframes pulse { 0% { transform:scale(.6); opacity:.7; } 15%,100% { transform:scale(7); opacity:0; } }
  @keyframes logo-flicker {
    0%,100% { filter:drop-shadow(0 5px 5px rgba(0,0,0,.8)) drop-shadow(0 0 8px rgba(125,255,138,.45)); }
    18% { filter:drop-shadow(0 5px 5px rgba(0,0,0,.8)) drop-shadow(0 0 16px rgba(125,255,138,.8)); }
    32% { filter:drop-shadow(0 5px 5px rgba(0,0,0,.8)) drop-shadow(0 0 6px rgba(125,255,138,.3)); }
    60% { filter:drop-shadow(0 5px 5px rgba(0,0,0,.8)) drop-shadow(0 0 14px rgba(181,124,255,.6)); }
  }
  @keyframes banana-fall {
    from { transform:translate3d(0,0,0) rotate(-35deg); }
    to { transform:translate3d(var(--drift),var(--fall-distance),0) rotate(var(--spin)); }
  }
  @keyframes glow-breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @keyframes logo-spin {
    0% { transform:rotateY(0); }
    4% { transform:rotateY(360deg); }
    100% { transform:rotateY(360deg); }
  }
  @keyframes score-pop {
    0% { transform:translateY(-16px) scale(1.2); opacity:0; }
    100% { transform:translateY(0) scale(1); opacity:1; }
  }
  @media (max-width:500px) {
    .wrap { padding:32px 16px; }
    .card { padding:6px 12px 10px; }
    :root { --logo-w:100px; }
    .champions-center { height:110px; }
    .progress-row { gap:2px; }
    .progress-row { --seg-h:3px; margin:8px 0 0; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
    .banana-drop { top:var(--resting-y); animation:none; opacity:.3; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="card" id="card" aria-label="Chupapi wins and losses">
    <div class="bg" aria-hidden="true"><span class="mist"></span><span class="web"></span><span class="pulse"></span><span class="pulse two"></span><span class="banana-rain" id="banana-rain"></span><span class="sweep"></span></div>
    <span class="edge win" aria-hidden="true"></span>
    <span class="edge loss" aria-hidden="true"></span>
    <div class="scoreline">
      <div class="side wins"><span class="number" id="w">0</span><span class="word win" id="w-word">WIN</span></div>
      <div class="champions-center">
        <img class="champions-logo" src="/assets/chupapi_logo.png" alt="Chupapi">
      </div>
      <div class="side loss"><span class="number" id="l">0</span><span class="word loss" id="l-word">LOSS</span></div>
    </div>
        <template id="banana-template">
      <svg class="banana" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="peel" x1="8" y1="14" x2="56" y2="54" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fff07a"/><stop offset=".55" stop-color="#ffd21f"/><stop offset="1" stop-color="#e8a600"/>
          </linearGradient>
        </defs>
        <path d="M45 6c1-2 4-3 6-1l-2 12c3 13-1 27-13 36C28 60 13 59 6 49c-1-2 0-4 2-3 12 6 24 1 30-8 5-8 5-18 4-27 0-2 2-4 3-5Z" fill="url(#peel)" stroke="#b57d00" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M17 49c13 1 22-8 26-20" fill="none" stroke="#fff8b0" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
        <path d="M45 6c1-2 4-3 6-1l-.8 4.5-5.4-.6Z" fill="#6b4a1a"/>
      </svg>
    </template>
    <div class="progress-row" id="progress" role="group" aria-label="Match results"></div>
  </section>
</div>
<script>
  const BASE = location.protocol === 'file:' ? 'http://localhost:3000' : '';
  const progress = document.getElementById('progress');
  const bananaRain = document.getElementById('banana-rain');
  const bananaTemplate = document.getElementById('banana-template');
  const progressSegments = 15;

  for (let i = 0; i < progressSegments; i++) {
    const segment = document.createElement('span');
    segment.className = 'progress-segment';
    progress.appendChild(segment);
  }

  // Whole-pixel, equal-width segments: fractional fr tracks render some
  // segments 1px wider than others, which shows as a ragged line when resized.
  const logoProbe = document.createElement('div');
  logoProbe.style.cssText = 'position:absolute;visibility:hidden;width:var(--logo-w)';
  document.body.appendChild(logoProbe);
  function layoutProgress() {
    const available = progress.clientWidth;
    const logo = Math.round(logoProbe.getBoundingClientRect().width);
    const minGap = window.matchMedia('(max-width:500px)').matches ? 2 : 4;
    let segment = Math.floor((available - logo - 16 * minGap) / progressSegments);
    segment -= segment % 2;
    if (segment < 2) return;
    const gap = Math.floor((available - logo - progressSegments * segment) / 16);
    progress.style.gridTemplateColumns = `repeat(7,${segment}px) ${segment / 2}px ${logo}px ${segment / 2}px repeat(7,${segment}px)`;
    progress.style.columnGap = `${gap}px`;
    progress.style.justifyContent = 'center';
  }
  new ResizeObserver(layoutProgress).observe(progress);
  layoutProgress();


  const bananaCount = 14 + Math.floor(Math.random() * 7);
  for (let i = 0; i < bananaCount; i++) {
    const drop = document.createElement('span');
    const banana = bananaTemplate.content.firstElementChild.cloneNode(true);
    const duration = 5 + Math.random() * 6;
    const size = 18 + Math.random() * 18;
    const availableWidth = Math.max(0, bananaRain.clientWidth - size);
    const x = ((i + Math.random()) / bananaCount) * availableWidth;
    banana.querySelector('#peel').id = `peel-${i}`;
    banana.innerHTML = banana.innerHTML.replaceAll('url(#peel)', `url(#peel-${i})`);
    drop.className = 'banana-drop';
    drop.style.setProperty('--x', `${x}px`);
    drop.style.setProperty('--size', `${size}px`);
    drop.style.setProperty('--opacity', `${0.3 + Math.random() * 0.35}`);
    drop.style.setProperty('--duration', `${duration}s`);
    drop.style.setProperty('--delay', `${-Math.random() * duration}s`);
    drop.style.setProperty('--drift', `${-35 + Math.random() * 70}px`);
    drop.style.setProperty('--spin', `${(Math.random() < .5 ? -1 : 1) * (90 + Math.random() * 180)}deg`);
    drop.style.setProperty('--fall-distance', `${bananaRain.clientHeight + 60}px`);
    drop.style.setProperty('--resting-y', `${Math.random() * 75}%`);
    drop.appendChild(banana);
    bananaRain.appendChild(drop);
  }

  let first = true;
  let shownHistory = [];

  const WORD_MS = 1000;
  const timers = {};

  function setNumber(number, value) {
    number.textContent = value;
    number.classList.remove('out', 'tick');
    void number.offsetWidth;
    number.classList.add('tick');
  }

  function updateScore(id, value) {
    const number = document.getElementById(id);
    const word = document.getElementById(id + '-word');
    const previous = Number(number.dataset.value ?? number.textContent);
    number.dataset.value = String(value);
    clearTimeout(timers[id]);
    word.classList.remove('show');
    if (first || value <= previous) {
      number.classList.remove('out', 'tick');
      number.textContent = value;
      return;
    }
    number.classList.add('out');
    void word.offsetWidth;
    word.classList.add('show');
    timers[id] = setTimeout(() => {
      word.classList.remove('show');
      setNumber(number, number.dataset.value);
    }, WORD_MS);
  }

  function render(state) {
    updateScore('w', state.wins);
    updateScore('l', state.losses);
    const total = state.wins + state.losses;
    const history = Array.isArray(state.history) && state.history.length === total
      ? state.history
      : [...'W'.repeat(state.wins), ...'L'.repeat(state.losses)];
    [...progress.children].forEach((segment, index) => {
      const result = history[index];
      const isNew = !first && result && !shownHistory[index];
      if (!result) segment.classList.remove('fresh');
      if (isNew) {
        segment.classList.remove('fresh');
        void segment.offsetWidth;
        segment.classList.add('fresh');
      }
      segment.classList.toggle('win', result === 'W');
      segment.classList.toggle('loss', result === 'L');
      segment.title = result === 'W' ? `Match ${index + 1}: Win` : result === 'L' ? `Match ${index + 1}: Loss` : `Match ${index + 1}: Not played`;
    });
    shownHistory = [...history];
    first = false;
  }

  const roomMatch = location.pathname.match(/^\/room\/([a-f0-9]{32})\//);
  const isPreview = new URLSearchParams(location.search).get('preview') === '1' || location.pathname.startsWith('/preview/');

  if (isPreview) {
    if (window.self === window.top) {
      const homeLink = document.createElement('a');
      homeLink.href = '/';
      homeLink.textContent = '← Scoreboard Studio';
      homeLink.style.cssText = 'position:fixed;top:10px;left:12px;color:#fff;font:700 11px "Cruyff Sans",Arial,sans-serif;text-decoration:none';
      document.body.appendChild(homeLink);
    }
    render({ wins:5, losses:4, history:[...'WLWWLWWLL'], max:15 });
  } else {
    new EventSource(roomMatch ? `/room/${roomMatch[1]}/events` : BASE + '/default/events').onmessage = event => render(JSON.parse(event.data));
  }
</script>
</body>
</html>
