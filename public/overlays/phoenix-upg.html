<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phoenix Upgrade Score Overlay</title>
<style>
  @font-face {
    font-family:"Cruyff Sans";
    src:url("/assets/FONTS/CruyffSans-Bold.ecd5078c.otf") format("opentype");
    font-style:normal;
    font-weight:700;
    font-display:swap;
  }
  :root {
    color-scheme:dark;
    --green:#61ed87;
    --red:#ff3b6b;
    --orange:#ff6a16;
    --violet:#b04dff;
    --overlay-width:640px;
    --logo-w:130px;
    --phoenix-w:460px;
  }
  html, body { margin:0; background:transparent; color:#fff; font-family:"Cruyff Sans","Arial Narrow",Arial,sans-serif; }
  .wrap { display:inline-block; padding:84px 24px; }
  .card {
    position:relative;
    box-sizing:border-box;
    width:min(var(--overlay-width),calc(100vw - 32px));
    padding:8px 20px 12px;
    isolation:isolate;
  }
  .bg {
    box-shadow:0 10px 24px rgba(0,0,0,.4);
    position:absolute;
    z-index:-2;
    inset:0;
    overflow:hidden;
    background:linear-gradient(180deg,rgba(20,8,16,.98),rgba(8,3,9,.98));
  }
  .bg::before {
    position:absolute;
    inset:0;
    background:linear-gradient(90deg,rgba(97,237,135,.08),transparent 30%,transparent 70%,rgba(255,59,107,.13));
    content:"";
  }
  .bg::before { animation:glow-breathe 6s ease-in-out infinite; }
  .line-motion {
    position:absolute;
    inset:0;
    background:linear-gradient(45deg,transparent 46%,rgba(255,255,255,.05) 50%,transparent 54%);
    background-size:22px 22px;
  }
  .line-motion::after {
    position:absolute;
    top:-40%;
    bottom:-40%;
    left:-20%;
    width:90px;
    background:linear-gradient(90deg,transparent,rgba(255,110,60,.22),transparent);
    content:"";
    transform:skewX(-22deg);
    animation:sweep 7s ease-in-out infinite;
  }
  .edge { position:absolute; z-index:-1; inset:0; pointer-events:none; }
  .edge.win {
    background:var(--green);
    width:6px;right:auto;
    filter:drop-shadow(0 0 6px rgba(97,237,135,.6));
  }
  .edge.loss {
    background:var(--red);
    width:6px;left:auto;
    filter:drop-shadow(0 0 6px rgba(255,59,107,.6));
  }
  .scoreline {
    display:grid;
    grid-template-columns:1fr var(--logo-w) 1fr;
    align-items:center;
    min-height:64px;
  }
  .side { position:relative; z-index:3; display:grid; place-items:center; min-width:0; }
  .side > * { grid-area:1 / 1; }
  .side.loss { grid-column:3; }
  .number {
    display:block;
    font-size:60px;
    font-weight:900;
    line-height:1;
    text-shadow:0 2px 8px rgba(0,0,0,.75);
  }
  .phoenix-center {
    position:absolute;
    z-index:1;
    top:50%;
    left:50%;
    display:flex;
    width:var(--phoenix-w);
    height:calc(var(--phoenix-w) * .56);
    align-items:center;
    justify-content:center;
    pointer-events:none;
    transform:translate(-50%,-50%);
  }
  .phoenix-center { --s:calc(var(--phoenix-w) * .27 / 420); }
  .phoenix-center::before {
    position:absolute;
    inset:8% 4%;
    background:radial-gradient(ellipse at center,rgba(255,80,30,.32),rgba(240,30,160,.16) 45%,transparent 70%);
    content:"";
    animation:halo-breathe 4s ease-in-out infinite;
  }
  .wings {
    position:absolute;
    top:50%;
    left:50%;
    width:calc(1536 * var(--s));
    height:calc(1024 * var(--s));
    margin:calc(-491 * var(--s)) 0 0 calc(-768 * var(--s));
  }
  .wing { position:absolute; inset:0; }
  .wing.left { transform-origin:calc(768 * var(--s)) 0; transform:scaleX(-1); }
  .piece {
    position:absolute;
    left:calc(var(--x) * var(--s));
    top:calc(var(--y) * var(--s));
    width:calc(var(--w) * var(--s));
    height:calc(var(--h) * var(--s));
  }
  .piece img { display:block; width:100%; height:100%; will-change:transform; }
  @keyframes halo-breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  .phoenix-logo {
    position:relative;
    display:block;
    width:calc(var(--phoenix-w) * .27 * 1.02);
    height:auto;
  }
  .progress-row {
    position:relative;
    z-index:3;
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,.5fr) var(--logo-w) minmax(0,.5fr) repeat(7,minmax(0,1fr));
    gap:4px;
    margin:12px 0 0;
    align-items:center;
    --seg-h:4px;
  }
  .progress-segment {
    height:var(--seg-h);
    background:rgba(230,239,239,.28);
  }
  .progress-segment:nth-child(8) { display:contents; }
  .progress-segment:nth-child(8)::before,
  .progress-segment:nth-child(8)::after {
    height:var(--seg-h);
    background:rgba(230,239,239,.28);
    content:"";
  }
  .progress-segment:nth-child(8)::before { grid-column:8; }
  .progress-segment:nth-child(8)::after { grid-column:10; }
  .progress-segment:nth-child(8).win::before, .progress-segment:nth-child(8).win::after { background:linear-gradient(var(--green),var(--green)) left center / 100% 100% no-repeat, rgba(230,239,239,.28); }
  .progress-segment:nth-child(8).loss::before, .progress-segment:nth-child(8).loss::after { background:linear-gradient(var(--red),var(--red)) left center / 100% 100% no-repeat, rgba(230,239,239,.28); }
  .progress-segment.win { background:linear-gradient(var(--green),var(--green)) left center / 100% 100% no-repeat, rgba(230,239,239,.28); }
  .progress-segment.loss { background:linear-gradient(var(--red),var(--red)) left center / 100% 100% no-repeat, rgba(230,239,239,.28); }
  .progress-segment.fresh { animation:seg-fill .6s ease-out both; }
  .progress-segment:nth-child(8).fresh { animation:none; }
  .progress-segment:nth-child(8).fresh::before { animation:seg-fill .3s ease-out both; }
  .progress-segment:nth-child(8).fresh::after { animation:seg-fill .3s ease-out .3s both; }
  @keyframes seg-fill { from { background-size:0% 100%, auto; } to { background-size:100% 100%, auto; } }
  .number { transition:opacity .18s ease, transform .18s ease; }
  .number.out { opacity:0; transform:scale(.6); }
  .number { color:#fff; -webkit-text-stroke:1.5px rgba(10,2,12,.85); paint-order:stroke fill; }
  .wins .number { text-shadow:0 0 14px rgba(255,106,22,.9),0 2px 6px rgba(0,0,0,.9); }
  .loss .number { text-shadow:0 0 14px rgba(176,77,255,.9),0 2px 6px rgba(0,0,0,.9); }
  .number.tick { animation:score-pop .48s cubic-bezier(.2,1.35,.35,1); }
  .word {
    font-size:44px;
    font-weight:900;
    letter-spacing:3px;
    line-height:1;
    opacity:0;
    pointer-events:none;
  }
  .word.win { color:var(--green); text-shadow:0 0 16px rgba(97,237,135,.8),0 2px 6px rgba(0,0,0,.95); }
  .word.loss { color:var(--red); text-shadow:0 0 16px rgba(255,59,107,.8),0 2px 6px rgba(0,0,0,.95); }
  .word.show { animation:word-pop 1s cubic-bezier(.2,1.2,.3,1) both; }
  @keyframes word-pop {
    0% { opacity:0; transform:scale(.4) translateY(10px); }
    25% { opacity:1; transform:scale(1.15) translateY(0); }
    70% { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(1.25); }
  }
  @keyframes sweep {
    0% { transform:translateX(0) skewX(-22deg); opacity:0; }
    10% { opacity:1; }
    55% { transform:translateX(900px) skewX(-22deg); opacity:1; }
    60%,100% { transform:translateX(900px) skewX(-22deg); opacity:0; }
  }
  @keyframes glow-breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @keyframes score-pop {
    0% { transform:translateY(-16px) scale(1.2); opacity:0; }
    100% { transform:translateY(0) scale(1); opacity:1; }
  }
  @media (max-width:500px) {
    .wrap { padding:56px 16px; }
    .card { padding:6px 12px 10px; }
    :root { --logo-w:90px; --phoenix-w:300px; }
    .progress-row { gap:2px; }
    .progress-row { --seg-h:3px; margin:8px 0 0; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="card" id="card" aria-label="Phoenix upgrade wins and losses">
    <div class="bg" aria-hidden="true"><span class="line-motion"></span></div>
    <span class="edge win" aria-hidden="true"></span>
    <span class="edge loss" aria-hidden="true"></span>
    <div class="scoreline">
      <div class="side wins"><span class="number" id="w">0</span><span class="word win" id="w-word">WIN</span></div>
      <div class="phoenix-center">
        <div class="wings" aria-hidden="true"><div class="wing right"><div class="piece" style="--x:968;--y:294;--w:510;--h:239"><img src="/assets/phoenix-wings/wing1.png" alt="" data-i="1" data-ox="1.8%" data-oy="70.3%"></div><div class="piece" style="--x:1157;--y:352;--w:205;--h:83"><img src="/assets/phoenix-wings/wing2.png" alt="" data-i="2" data-ox="0.0%" data-oy="63.9%"></div><div class="piece" style="--x:1167;--y:459;--w:197;--h:77"><img src="/assets/phoenix-wings/wing3.png" alt="" data-i="3" data-ox="0.0%" data-oy="3.9%"></div><div class="piece" style="--x:1278;--y:449;--w:240;--h:155"><img src="/assets/phoenix-wings/wing4.png" alt="" data-i="4" data-ox="0.0%" data-oy="92.9%"></div><div class="piece" style="--x:920;--y:460;--w:359;--h:179"><img src="/assets/phoenix-wings/wing5.png" alt="" data-i="5" data-ox="14.8%" data-oy="45.3%"></div></div><div class="wing left"><div class="piece" style="--x:968;--y:294;--w:510;--h:239"><img src="/assets/phoenix-wings/wing1.png" alt="" data-i="1" data-ox="1.8%" data-oy="70.3%"></div><div class="piece" style="--x:1157;--y:352;--w:205;--h:83"><img src="/assets/phoenix-wings/wing2.png" alt="" data-i="2" data-ox="0.0%" data-oy="63.9%"></div><div class="piece" style="--x:1167;--y:459;--w:197;--h:77"><img src="/assets/phoenix-wings/wing3.png" alt="" data-i="3" data-ox="0.0%" data-oy="3.9%"></div><div class="piece" style="--x:1278;--y:449;--w:240;--h:155"><img src="/assets/phoenix-wings/wing4.png" alt="" data-i="4" data-ox="0.0%" data-oy="92.9%"></div><div class="piece" style="--x:920;--y:460;--w:359;--h:179"><img src="/assets/phoenix-wings/wing5.png" alt="" data-i="5" data-ox="14.8%" data-oy="45.3%"></div></div></div>
        <img class="phoenix-logo" id="phoenix-logo" src="/assets/phoenix_logo.png" alt="Phoenix">
      </div>
      <div class="side loss"><span class="number" id="l">0</span><span class="word loss" id="l-word">LOSS</span></div>
    </div>
    <div class="progress-row" id="progress" role="group" aria-label="Match results"></div>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const BASE = location.protocol === 'file:' ? 'http://localhost:3000' : '';
  // The wing artwork is cut into flame pieces (assets/phoenix-wings); GSAP sways,
  // flexes and flickers each piece from its root at the logo. Motion is
  // transform-only, so it runs on the GPU and follows the display refresh.
  (() => {
    if (!window.gsap) return;
    const motion = {
      1: { rotation:1.4, scaleX:.02, y:1.5, duration:3.4 },
      2: { rotation:4.5, scaleX:.05, y:2, duration:2.2 },
      3: { rotation:3.2, scaleX:.04, y:1.5, duration:2.6 },
      4: { rotation:6.5, scaleX:.06, y:3, duration:2.0 },
      5: { rotation:2.2, scaleX:.03, y:2, duration:3.0 },
    };
    document.querySelectorAll('.piece img').forEach(img => {
      const m = motion[img.dataset.i];
      const left = !!img.closest('.wing.left');
      gsap.set(img, { transformOrigin:`${img.dataset.ox} ${img.dataset.oy}` });
      const tween = gsap.fromTo(img,
        { rotation:-m.rotation, scaleX:1, y:-m.y },
        { rotation:m.rotation, scaleX:1 + m.scaleX, y:m.y, duration:m.duration, ease:'sine.inOut', yoyo:true, repeat:-1 });
      tween.progress(left ? .5 + Math.random() * .2 : Math.random() * .3);
    });
  })();

  const progress = document.getElementById('progress');
  const progressSegments = 15;

  for (let i = 0; i < progressSegments; i++) {
    const segment = document.createElement('span');
    segment.className = 'progress-segment';
    progress.appendChild(segment);
  }

  // Whole-pixel, equal-width segments: fractional fr tracks render some
  // segments 1px wider than others, which shows as a ragged line when resized.
  const logoProbe = document.createElement('div');
  logoProbe.style.cssText = 'position:absolute;visibility:hidden;width:var(--logo-w)';
  document.body.appendChild(logoProbe);
  function layoutProgress() {
    const available = progress.clientWidth;
    const logo = Math.round(logoProbe.getBoundingClientRect().width);
    const minGap = window.matchMedia('(max-width:500px)').matches ? 2 : 4;
    let segment = Math.floor((available - logo - 16 * minGap) / progressSegments);
    segment -= segment % 2;
    if (segment < 2) return;
    const gap = Math.floor((available - logo - progressSegments * segment) / 16);
    progress.style.gridTemplateColumns = `repeat(7,${segment}px) ${segment / 2}px ${logo}px ${segment / 2}px repeat(7,${segment}px)`;
    progress.style.columnGap = `${gap}px`;
    progress.style.justifyContent = 'center';
  }
  new ResizeObserver(layoutProgress).observe(progress);
  layoutProgress();

  let first = true;
  let shownHistory = [];

  const WORD_MS = 1000;
  const timers = {};

  function setNumber(number, value) {
    number.textContent = value;
    number.classList.remove('out', 'tick');
    void number.offsetWidth;
    number.classList.add('tick');
  }

  function updateScore(id, value) {
    const number = document.getElementById(id);
    const word = document.getElementById(id + '-word');
    const previous = Number(number.dataset.value ?? number.textContent);
    number.dataset.value = String(value);
    clearTimeout(timers[id]);
    word.classList.remove('show');
    if (first || value <= previous) {
      number.classList.remove('out', 'tick');
      number.textContent = value;
      return;
    }
    number.classList.add('out');
    void word.offsetWidth;
    word.classList.add('show');
    timers[id] = setTimeout(() => {
      word.classList.remove('show');
      setNumber(number, number.dataset.value);
    }, WORD_MS);
  }

  function render(state) {
    updateScore('w', state.wins);
    updateScore('l', state.losses);
    const total = state.wins + state.losses;
    const history = Array.isArray(state.history) && state.history.length === total
      ? state.history
      : [...'W'.repeat(state.wins), ...'L'.repeat(state.losses)];
    [...progress.children].forEach((segment, index) => {
      const result = history[index];
      const isNew = !first && result && !shownHistory[index];
      if (!result) segment.classList.remove('fresh');
      if (isNew) {
        segment.classList.remove('fresh');
        void segment.offsetWidth;
        segment.classList.add('fresh');
      }
      segment.classList.toggle('win', result === 'W');
      segment.classList.toggle('loss', result === 'L');
      segment.title = result === 'W' ? `Match ${index + 1}: Win` : result === 'L' ? `Match ${index + 1}: Loss` : `Match ${index + 1}: Not played`;
    });
    shownHistory = [...history];
    first = false;
  }

  const roomMatch = location.pathname.match(/^\/room\/([a-f0-9]{32})\//);
  const isPreview = new URLSearchParams(location.search).get('preview') === '1' || location.pathname.startsWith('/preview/');

  if (isPreview) {
    if (window.self === window.top) {
      const homeLink = document.createElement('a');
      homeLink.href = '/';
      homeLink.textContent = '← Scoreboard Studio';
      homeLink.style.cssText = 'position:fixed;top:10px;left:12px;color:#fff;font:700 11px "Cruyff Sans",Arial,sans-serif;text-decoration:none';
      document.body.appendChild(homeLink);
    }
    render({ wins:5, losses:4, history:[...'WLWWLWWLL'], max:15 });
  } else {
    new EventSource(roomMatch ? `/room/${roomMatch[1]}/events` : BASE + '/default/events').onmessage = event => render(JSON.parse(event.data));
  }
</script>
</body>
</html>
