<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champions Record Overlay</title>
<style>
  :root {
    color-scheme:dark;
    --gold:#e8c77e;
    --gold-bright:#fff0c4;
    --cyan:#78e6df;
    --ink:#07131d;
    --muted:#8fa3ae;
    --overlay-width:400px;
  }
  html, body { margin:0; background:transparent; color:#f7f7f2; font-family:"Segoe UI",Arial,sans-serif; }
  .wrap { display:inline-block; padding:20px; }
  .card {
    position:relative;
    box-sizing:border-box;
    width:min(var(--overlay-width),calc(100vw - 24px));
    overflow:hidden;
    padding:15px 20px 13px;
    border:1px solid rgba(232,199,126,.68);
    border-radius:15px;
    background:transparent;
    box-shadow:0 0 16px rgba(120,230,223,.08);
  }
  .card::before {
    position:absolute;
    inset:5px;
    border:1px solid rgba(255,255,255,.055);
    border-radius:10px;
    content:"";
    pointer-events:none;
  }
  .card::after {
    position:absolute;
    top:0;
    right:0;
    width:44%;
    height:2px;
    background:linear-gradient(90deg,transparent,var(--cyan),var(--gold-bright));
    content:"";
    opacity:.9;
  }
  .topline { display:flex; align-items:center; justify-content:space-between; margin:0 2px 9px; }
  .brand { display:flex; align-items:center; gap:8px; color:#fff; font-size:13px; font-weight:850; letter-spacing:3px; }
  .brand-mark { width:5px; height:5px; transform:rotate(45deg); background:var(--gold); box-shadow:0 0 8px rgba(232,199,126,.7); }
  .subtitle { margin-left:3px; color:var(--muted); font-size:9px; font-weight:700; letter-spacing:1.8px; }
  .live { display:flex; align-items:center; gap:6px; color:#b9d3d4; font-size:8px; font-weight:800; letter-spacing:1.5px; }
  .live-dot { width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 9px var(--cyan); }
  .score-area { min-width:0; }
  .scoreline { display:grid; grid-template-columns:1fr 54px 1fr; align-items:center; }
  .side { display:flex; align-items:center; gap:10px; }
  .side.loss { justify-content:flex-end; }
  .number { color:var(--gold-bright); font-size:43px; font-weight:850; line-height:.95; letter-spacing:-2px; text-shadow:0 0 18px rgba(232,199,126,.25); }
  .loss .number { color:#f5f8fa; text-shadow:0 0 18px rgba(120,230,223,.15); }
  .label { color:var(--gold); font-size:9px; font-weight:850; letter-spacing:2.4px; }
  .loss .label { color:var(--cyan); }
  .separator { color:#61727c; font-size:23px; font-weight:300; text-align:center; }
  .progress-row { display:flex; align-items:center; gap:10px; margin-top:11px; }
  .progress-label { flex:none; color:var(--muted); font-size:8px; font-weight:800; letter-spacing:1.3px; }
  .segments { display:grid; flex:1; grid-template-columns:repeat(15,1fr); gap:4px; }
  .segment { height:3px; border-radius:3px; background:rgba(212,228,229,.15); }
  .segment.win { background:linear-gradient(90deg,var(--cyan),#d4f8e9); box-shadow:0 0 7px rgba(120,230,223,.45); }
  .segment.loss { background:linear-gradient(90deg,#ff626f,#ff9a86); box-shadow:0 0 7px rgba(255,98,111,.55); }
  .played-count { flex:none; min-width:37px; color:#d8e4e6; font-size:9px; font-weight:750; text-align:right; }
  .number.tick { animation:score-pop .48s cubic-bezier(.2,1.35,.35,1); }
  .card.flash { animation:card-flash .55s ease-out; }
  @keyframes score-pop { 0% { transform:translateY(-16px) scale(1.2); opacity:0; } 100% { transform:translateY(0) scale(1); opacity:1; } }
  @keyframes card-flash { 45% { filter:brightness(1.55); box-shadow:0 0 32px rgba(120,230,223,.35); } }
  @media (max-width:500px) {
    .wrap { padding:12px; }
    .card { padding:13px; }
    .scoreline { grid-template-columns:1fr 26px 1fr; }
    .side { gap:6px; }
    .number { font-size:35px; }
    .label { font-size:8px; letter-spacing:1.5px; }
    .segments { gap:2px; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="card" id="card" aria-label="Champions wins and losses">
    <div class="topline">
      <div>
        <div class="brand"><span class="brand-mark"></span>CHAMPIONS</div>
      </div>
      <div class="live"><span class="live-dot"></span>LIVE RECORD</div>
    </div>
    <div class="score-area">
      <div class="scoreline">
        <div class="side">
          <span class="number" id="w">0</span>
          <span class="label">WINS</span>
        </div>
        <span class="separator">—</span>
        <div class="side loss">
          <span class="label">LOSSES</span>
          <span class="number" id="l">0</span>
        </div>
      </div>
      <div class="progress-row">
        <span class="progress-label">MATCHES</span>
        <div class="segments" id="segments" aria-label="Match result history"></div>
        <span class="played-count" id="played">0 / 15</span>
      </div>
    </div>
  </section>
</div>
<script>
  const BASE = location.protocol === 'file:' ? 'http://localhost:3000' : '';
  const segments = document.getElementById('segments');
  for (let i = 0; i < 15; i++) {
    const segment = document.createElement('span');
    segment.className = 'segment';
    segments.appendChild(segment);
  }
  let first = true;

  function updateScore(id, value) {
    const number = document.getElementById(id);
    if (number.textContent === String(value)) return;
    number.textContent = value;
    if (first) return;
    number.classList.remove('tick');
    void number.offsetWidth;
    number.classList.add('tick');
    const card = document.getElementById('card');
    card.classList.remove('flash');
    void card.offsetWidth;
    card.classList.add('flash');
  }

  function render(state) {
    updateScore('w', state.wins);
    updateScore('l', state.losses);
    const total = state.wins + state.losses;
    const history = Array.isArray(state.history) && state.history.length === total
      ? state.history
      : [...'W'.repeat(state.wins), ...'L'.repeat(state.losses)];
    const played = Math.min(total, 15);
    [...segments.children].forEach((segment, index) => {
      const result = history[index];
      segment.classList.toggle('win', result === 'W');
      segment.classList.toggle('loss', result === 'L');
      segment.title = result === 'W' ? `Match ${index + 1}: Win` : result === 'L' ? `Match ${index + 1}: Loss` : `Match ${index + 1}: Not played`;
    });
    document.getElementById('played').textContent = `${played} / ${state.max || 15}`;
    first = false;
  }

  if (new URLSearchParams(location.search).get('preview') === '1') {
    document.querySelector('.live').lastChild.textContent = 'DESIGN PREVIEW';
    render({ wins:5, losses:4, history:[...'WLWWLWWLL'], max:15 });
  } else {
    new EventSource(BASE + '/champions/events').onmessage = event => render(JSON.parse(event.data));
  }
</script>
</body>
</html>
