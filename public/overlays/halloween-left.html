<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halloween Score Overlay (Left Logo)</title>
<style>
  @font-face {
    font-family:"Cruyff Sans";
    src:url("/assets/FONTS/CruyffSans-Bold.ecd5078c.otf") format("opentype");
    font-style:normal;
    font-weight:700;
    font-display:swap;
  }
  :root {
    color-scheme:dark;
    --green:#9be86f;
    --red:#bd83ff;
    --overlay-width:500px;
    --logo-w:130px;
    --pad:20px;
    --wrap-x:24px;
    --logo-clear:calc(var(--logo-w) / 2 - var(--pad) + 14px);
  }
  html, body { margin:0; background:transparent; color:#fff; font-family:"Cruyff Sans","Arial Narrow",Arial,sans-serif; }
  .wrap { display:inline-block; padding:44px var(--wrap-x) 44px calc(var(--logo-w) / 2 + var(--wrap-x)); }
  .card {
    position:relative;
    box-sizing:border-box;
    width:min(var(--overlay-width),calc(100vw - var(--logo-w) / 2 - 2 * var(--wrap-x)));
    padding:8px var(--pad) 12px;
    isolation:isolate;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.4));
  }
  .bg {
    position:absolute;
    z-index:-2;
    inset:0;
    overflow:hidden;
    background:linear-gradient(180deg,rgba(24,10,28,.98),rgba(9,4,12,.98));
  }
  .bg::before {
    position:absolute;
    inset:0;
    background:linear-gradient(90deg,rgba(155,232,111,.08),transparent 30%,transparent 70%,rgba(189,131,255,.13));
    content:"";
  }
  .bg::before { animation:glow-breathe 6s ease-in-out infinite; }
  .mist {
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 40% 90% at 20% 80%,rgba(189,131,255,.16),transparent 70%),
      radial-gradient(ellipse 40% 90% at 80% 20%,rgba(255,135,51,.14),transparent 70%);
    background-size:200% 100%;
    animation:mist-drift 14s ease-in-out infinite alternate;
  }
  .web {
    position:absolute;
    inset:0;
    background:linear-gradient(45deg,transparent 46%,rgba(255,208,154,.06) 50%,transparent 54%);
    background-size:22px 22px;
    animation:texture-drift 6s linear infinite;
  }
  .sweep {
    position:absolute;
    top:-40%;
    bottom:-40%;
    left:-20%;
    width:90px;
    background:linear-gradient(90deg,transparent,rgba(255,150,60,.2),transparent);
    transform:skewX(-22deg);
    animation:sweep 7s ease-in-out infinite;
  }
  .pulse {
    position:absolute;
    top:50%;
    left:0;
    width:120px;
    height:120px;
    margin:-60px 0 0 -60px;
    border:2px solid rgba(255,150,60,.45);
    border-radius:50%;
    opacity:0;
    animation:pulse 30s ease-out infinite;
  }
  .pulse.two { border-color:rgba(189,131,255,.45); animation-delay:1.5s; }
  .pumpkin {
    display:block;
    width:100%;
    height:auto;
    filter:drop-shadow(0 0 9px rgba(255,117,37,.48));
  }
  .pumpkin-rain { position:absolute; z-index:1; inset:0; overflow:hidden; pointer-events:none; }
  .pumpkin-drop {
    position:absolute;
    top:-40px;
    left:var(--x);
    width:var(--size);
    opacity:var(--opacity);
    animation:pumpkin-fall var(--duration) linear var(--delay) infinite;
  }
  .edge { position:absolute; z-index:-1; inset:0; pointer-events:none; }
  .edge.win {
    background:var(--green);
    width:6px;right:auto;
    filter:drop-shadow(0 0 6px rgba(155,232,111,.6));
  }
  .edge.loss {
    background:var(--red);
    width:6px;left:auto;
    filter:drop-shadow(0 0 6px rgba(189,131,255,.6));
  }
  .scoreline {
    display:grid;
    grid-template-columns:1fr 1fr;
    padding-left:var(--logo-clear);
    align-items:center;
    min-height:64px;
  }
  .side { display:grid; place-items:center; min-width:0; }
  .side > * { grid-area:1 / 1; }
  .side.loss { grid-column:2; border-left:2px solid rgba(255,255,255,.28); }
  .number {
    display:block;
    font-size:60px;
    font-weight:900;
    line-height:1;
    text-shadow:0 2px 8px rgba(0,0,0,.75);
  }
  .champions-center {
    position:absolute;
    z-index:2;
    top:50%;
    left:0;
    display:flex;
    width:var(--logo-w);
    height:140px;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    transform:translate(-50%,-50%);
  }
  .champions-logo {
    display:block;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    filter:drop-shadow(0 5px 5px rgba(0,0,0,.8));
    transform-style:preserve-3d;
    animation:logo-spin 30s linear infinite,logo-flicker 3.2s ease-in-out infinite;
  }
  .progress-row {
    display:grid;
    grid-template-columns:repeat(15,minmax(0,1fr));
    padding-left:var(--logo-clear);
    gap:4px;
    margin:12px 0 0;
    align-items:center;
    --seg-h:4px;
  }
  .progress-segment {
    height:var(--seg-h);
    background:rgba(230,239,239,.28);
  }
  .progress-segment.win { background:linear-gradient(var(--green),var(--green)) left center / 100% 100% no-repeat, rgba(230,239,239,.28); }
  .progress-segment.loss { background:linear-gradient(var(--red),var(--red)) left center / 100% 100% no-repeat, rgba(230,239,239,.28); }
  .progress-segment.fresh { animation:seg-fill .6s ease-out both; }
  @keyframes seg-fill { from { background-size:0% 100%, auto; } to { background-size:100% 100%, auto; } }
  .number { transition:opacity .18s ease, transform .18s ease; }
  .number.out { opacity:0; transform:scale(.6); }
  .wins .number { color:#ffd09a; }
  .loss .number { color:#f3eaff; }
  .number.tick { animation:score-pop .48s cubic-bezier(.2,1.35,.35,1); }
  .word {
    font-size:44px;
    font-weight:900;
    letter-spacing:3px;
    line-height:1;
    opacity:0;
    pointer-events:none;
  }
  .word.win { color:var(--green); text-shadow:0 0 16px rgba(155,232,111,.8),0 2px 8px rgba(0,0,0,.75); }
  .word.loss { color:var(--red); text-shadow:0 0 16px rgba(189,131,255,.8),0 2px 8px rgba(0,0,0,.75); }
  .word.show { animation:word-pop 1s cubic-bezier(.2,1.2,.3,1) both; }
  @keyframes word-pop {
    0% { opacity:0; transform:scale(.4) translateY(10px); }
    25% { opacity:1; transform:scale(1.15) translateY(0); }
    70% { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(1.25); }
  }
  @keyframes sweep { 0% { left:-20%; opacity:0; } 10% { opacity:1; } 55% { left:110%; opacity:1; } 60%,100% { left:110%; opacity:0; } }
  @keyframes texture-drift { from { background-position:0 0; } to { background-position:22px 0; } }
  @keyframes mist-drift { from { background-position:0 0; } to { background-position:60% 0; } }
  @keyframes pulse { 0% { transform:scale(.6); opacity:.7; } 15%,100% { transform:scale(7); opacity:0; } }
  @keyframes logo-flicker {
    0%,100% { filter:drop-shadow(0 5px 5px rgba(0,0,0,.8)) drop-shadow(0 0 8px rgba(255,135,51,.45)); }
    18% { filter:drop-shadow(0 5px 5px rgba(0,0,0,.8)) drop-shadow(0 0 16px rgba(255,150,60,.85)); }
    32% { filter:drop-shadow(0 5px 5px rgba(0,0,0,.8)) drop-shadow(0 0 6px rgba(255,135,51,.35)); }
    60% { filter:drop-shadow(0 5px 5px rgba(0,0,0,.8)) drop-shadow(0 0 14px rgba(189,131,255,.6)); }
  }
  @keyframes pumpkin-fall {
    from { transform:translate3d(0,0,0) rotate(-12deg); }
    to { transform:translate3d(var(--drift),var(--fall-distance),0) rotate(18deg); }
  }
  @keyframes glow-breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @keyframes logo-spin {
    0% { transform:rotateY(0); }
    4% { transform:rotateY(360deg); }
    100% { transform:rotateY(360deg); }
  }
  @keyframes score-pop {
    0% { transform:translateY(-16px) scale(1.2); opacity:0; }
    100% { transform:translateY(0) scale(1); opacity:1; }
  }
  @media (max-width:500px) {
    
    :root { --logo-w:100px; --pad:12px; --wrap-x:16px; }
    .card { padding:6px var(--pad) 10px; }
    .champions-center { height:110px; }
    .progress-row { gap:2px; }
    .progress-row { --seg-h:3px; margin:8px 0 0; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
    .pumpkin-drop { top:var(--resting-y); animation:none; opacity:.3; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="card" id="card" aria-label="Halloween wins and losses">
    <div class="bg" aria-hidden="true"><span class="mist"></span><span class="web"></span><span class="pulse"></span><span class="pulse two"></span><span class="pumpkin-rain" id="pumpkin-rain"></span><span class="sweep"></span></div>
    <span class="edge win" aria-hidden="true"></span>
    <span class="edge loss" aria-hidden="true"></span>
    <div class="scoreline">
      <div class="side wins"><span class="number" id="w">0</span><span class="word win" id="w-word">WIN</span></div>
      <div class="champions-center">
        <img class="champions-logo" src="/assets/halloween-pumpkin.png" alt="Halloween pumpkin">
      </div>
      <div class="side loss"><span class="number" id="l">0</span><span class="word loss" id="l-word">LOSS</span></div>
    </div>
        <template id="pumpkin-template">
      <svg class="pumpkin" viewBox="0 0 64 56" role="img" aria-label="Glowing jack-o'-lantern">
        <defs>
          <linearGradient id="gourd" x1="12" y1="11" x2="51" y2="47" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ffbd56"/><stop offset=".48" stop-color="#ff812b"/><stop offset="1" stop-color="#c74416"/>
          </linearGradient>
          <linearGradient id="glow" x1="25" y1="24" x2="39" y2="41" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fff4a3"/><stop offset="1" stop-color="#ffb42e"/>
          </linearGradient>
        </defs>
        <path d="M31 13c-1-5 1-9 5-11 2 4 1 7-2 10l-1 3" fill="#72934c" stroke="#a8b867" stroke-width="1.5"/>
        <path d="M32 14c-5-6-15-3-18 3-9 1-12 9-10 18 2 11 12 17 28 17s26-6 28-17c2-9-1-17-10-18-4-6-13-9-18-3Z" fill="url(#gourd)" stroke="#ffb14b" stroke-width="1.5"/>
        <path d="M32 14c-4 7-4 27 0 38M17 18c-5 8-5 22 1 29M47 18c5 8 5 22-1 29" fill="none" stroke="#a83c1b" stroke-opacity=".55" stroke-width="2"/>
        <path d="m15 25 13 3-7 8-6-11Zm34 0-13 3 7 8 6-11Z" fill="url(#glow)"/>
        <path d="m24 41 5-3 3 3 4-3 7 3-4 5H28l-4-5Z" fill="url(#glow)"/>
        <path d="m29 39 1 5m8-5-1 5" stroke="#a83c1b" stroke-width="1.2"/>
        <path d="M13 20c-3-2-5-1-7 1m45-1c3-2 5-1 7 1" fill="none" stroke="#ffcb70" stroke-linecap="round" stroke-width="1.5"/>
      </svg>
    </template>
    <div class="progress-row" id="progress" role="group" aria-label="Match results"></div>
  </section>
</div>
<script>
  const BASE = location.protocol === 'file:' ? 'http://localhost:3000' : '';
  const progress = document.getElementById('progress');
  const pumpkinRain = document.getElementById('pumpkin-rain');
  const pumpkinTemplate = document.getElementById('pumpkin-template');
  const progressSegments = 15;

  for (let i = 0; i < progressSegments; i++) {
    const segment = document.createElement('span');
    segment.className = 'progress-segment';
    progress.appendChild(segment);
  }

  // Whole-pixel, equal-width segments: fractional fr tracks render some
  // segments 1px wider than others, which shows as a ragged line when resized.
  function layoutProgress() {
    const style = getComputedStyle(progress);
    const available = progress.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    const minGap = window.matchMedia('(max-width:500px)').matches ? 2 : 4;
    let segment = Math.floor((available - 14 * minGap) / progressSegments);
    segment -= segment % 2;
    if (segment < 2) return;
    const gap = Math.floor((available - progressSegments * segment) / 14);
    progress.style.gridTemplateColumns = `repeat(15,${segment}px)`;
    progress.style.columnGap = `${gap}px`;
    progress.style.justifyContent = 'center';
  }
  new ResizeObserver(layoutProgress).observe(progress);
  layoutProgress();


  const pumpkinCount = 14 + Math.floor(Math.random() * 7);
  for (let i = 0; i < pumpkinCount; i++) {
    const drop = document.createElement('span');
    const pumpkin = pumpkinTemplate.content.firstElementChild.cloneNode(true);
    const duration = 5 + Math.random() * 6;
    const size = 16 + Math.random() * 17;
    const availableWidth = Math.max(0, pumpkinRain.clientWidth - size);
    const x = ((i + Math.random()) / pumpkinCount) * availableWidth;
    const gradientIds = [`gourd-${i}`, `glow-${i}`];
    pumpkin.querySelector('#gourd').id = gradientIds[0];
    pumpkin.querySelector('#glow').id = gradientIds[1];
    pumpkin.innerHTML = pumpkin.innerHTML
      .replaceAll('url(#gourd)', `url(#${gradientIds[0]})`)
      .replaceAll('url(#glow)', `url(#${gradientIds[1]})`);
    pumpkin.removeAttribute('role');
    pumpkin.removeAttribute('aria-label');
    pumpkin.setAttribute('aria-hidden', 'true');
    drop.className = 'pumpkin-drop';
    drop.style.setProperty('--x', `${x}px`);
    drop.style.setProperty('--size', `${size}px`);
    drop.style.setProperty('--opacity', `${0.28 + Math.random() * 0.35}`);
    drop.style.setProperty('--duration', `${duration}s`);
    drop.style.setProperty('--delay', `${-Math.random() * duration}s`);
    drop.style.setProperty('--drift', `${-35 + Math.random() * 70}px`);
    drop.style.setProperty('--fall-distance', `${pumpkinRain.clientHeight + 60}px`);
    drop.style.setProperty('--resting-y', `${Math.random() * 75}%`);
    drop.appendChild(pumpkin);
    pumpkinRain.appendChild(drop);
  }

  let first = true;
  let shownHistory = [];

  const WORD_MS = 1000;
  const timers = {};

  function setNumber(number, value) {
    number.textContent = value;
    number.classList.remove('out', 'tick');
    void number.offsetWidth;
    number.classList.add('tick');
  }

  function updateScore(id, value) {
    const number = document.getElementById(id);
    const word = document.getElementById(id + '-word');
    const previous = Number(number.dataset.value ?? number.textContent);
    number.dataset.value = String(value);
    clearTimeout(timers[id]);
    word.classList.remove('show');
    if (first || value <= previous) {
      number.classList.remove('out', 'tick');
      number.textContent = value;
      return;
    }
    number.classList.add('out');
    void word.offsetWidth;
    word.classList.add('show');
    timers[id] = setTimeout(() => {
      word.classList.remove('show');
      setNumber(number, number.dataset.value);
    }, WORD_MS);
  }

  function render(state) {
    updateScore('w', state.wins);
    updateScore('l', state.losses);
    const total = state.wins + state.losses;
    const history = Array.isArray(state.history) && state.history.length === total
      ? state.history
      : [...'W'.repeat(state.wins), ...'L'.repeat(state.losses)];
    [...progress.children].forEach((segment, index) => {
      const result = history[index];
      const isNew = !first && result && !shownHistory[index];
      if (!result) segment.classList.remove('fresh');
      if (isNew) {
        segment.classList.remove('fresh');
        void segment.offsetWidth;
        segment.classList.add('fresh');
      }
      segment.classList.toggle('win', result === 'W');
      segment.classList.toggle('loss', result === 'L');
      segment.title = result === 'W' ? `Match ${index + 1}: Win` : result === 'L' ? `Match ${index + 1}: Loss` : `Match ${index + 1}: Not played`;
    });
    shownHistory = [...history];
    first = false;
  }

  const roomMatch = location.pathname.match(/^\/room\/([a-f0-9]{32})\//);
  const isPreview = new URLSearchParams(location.search).get('preview') === '1' || location.pathname.startsWith('/preview/');

  if (isPreview) {
    if (window.self === window.top) {
      const homeLink = document.createElement('a');
      homeLink.href = '/';
      homeLink.textContent = '← Scoreboard Studio';
      homeLink.style.cssText = 'position:fixed;top:10px;left:12px;color:#fff;font:700 11px "Cruyff Sans",Arial,sans-serif;text-decoration:none';
      document.body.appendChild(homeLink);
    }
    render({ wins:5, losses:4, history:[...'WLWWLWWLL'], max:15 });
  } else {
    new EventSource(roomMatch ? `/room/${roomMatch[1]}/events` : BASE + '/default/events').onmessage = event => render(JSON.parse(event.data));
  }
</script>
</body>
</html>
