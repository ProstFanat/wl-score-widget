<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luc1fer24 Score Overlay</title>
<style>
  @font-face {
    font-family:"Cruyff Sans";
    src:url("/assets/FONTS/CruyffSans-Bold.ecd5078c.otf") format("opentype");
    font-style:normal;
    font-weight:700;
    font-display:swap;
  }
  :root {
    color-scheme:dark;
    --green:#0b0000;
    --red:#0b0000;
    --overlay-width:640px;
    --logo-w:130px;
  }
  html, body { margin:0; background:transparent; color:#fff; font-family:"Cruyff Sans","Arial Narrow",Arial,sans-serif; }
  .wrap { display:inline-block; padding:44px 24px; }
  .card {
    position:relative;
    box-sizing:border-box;
    width:min(var(--overlay-width),calc(100vw - 32px));
    padding:0 20px;
    isolation:isolate;
    clip-path:inset(-80px -60px -80px -60px);
  }
  .bg {
    position:absolute;
    z-index:-1;
    inset:0;
    overflow:hidden;
    background:linear-gradient(180deg,rgba(20,20,20,.98),rgba(0,0,0,.98));
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.4));
  }
  .fire { position:absolute; left:0; right:0; bottom:0; height:44px; pointer-events:none; }
  .fire svg { display:block; width:100%; height:100%; overflow:visible; }
  .flame { transform-box:fill-box; transform-origin:50% 100%; animation:flame-flicker 1s ease-in-out infinite; }
  @keyframes flame-flicker {
    0%,100% { transform:scale(1,1) skewX(0); }
    25% { transform:scale(.92,1.14) skewX(var(--lean,4deg)); }
    50% { transform:scale(1.06,.86) skewX(0); }
    75% { transform:scale(.95,1.08) skewX(calc(var(--lean,4deg) * -1)); }
  }
  .bg::before {
    position:absolute;
    inset:0;
    background:linear-gradient(90deg,rgba(255,16,24,.2),transparent 30%,transparent 70%,rgba(255,16,24,.12));
    content:"";
  }
  .bg::before { animation:glow-breathe 6s ease-in-out infinite; }
  .line-motion {
    position:absolute;
    inset:0;
    background:linear-gradient(45deg,transparent 46%,rgba(255,255,255,.05) 50%,transparent 54%);
    background-size:22px 22px;
    animation:texture-drift 5s linear infinite;
  }
  .line-motion::after {
    position:absolute;
    top:-40%;
    bottom:-40%;
    left:-20%;
    width:90px;
    background:linear-gradient(90deg,transparent,rgba(255,16,24,.22),transparent);
    content:"";
    transform:skewX(-22deg);
    animation:sweep 7s ease-in-out infinite;
  }
  .pulse {
    position:absolute;
    top:50%;
    left:50%;
    width:120px;
    height:120px;
    margin:-60px 0 0 -60px;
    border:2px solid rgba(255,16,24,.45);
    border-radius:50%;
    opacity:0;
    animation:pulse 30s ease-out infinite;
  }
  .pulse.two { animation-delay:1.5s; }
  .edge { position:absolute; z-index:0; inset:0; pointer-events:none; }
  .edge.win {
    background:var(--green);
    width:6px;right:auto;
    filter:drop-shadow(0 0 6px rgba(0, 0, 0, 0.6));
  }
  .edge.loss {
    background:var(--red);
    width:6px;left:auto;
    filter:drop-shadow(0 0 6px rgba(0, 0, 0, 0.6));
  }
  .scoreline {
    display:grid;
    grid-template-columns:1fr var(--logo-w) 1fr;
    align-items:center;
    min-height:96px;
  }
  .side { display:grid; place-items:center; min-width:0; }
  .side > * { grid-area:1 / 1; }
  .side { position:relative; overflow:visible; }
  .side.loss { grid-column:3; }
  .number {
    display:block;
    font-size:60px;
    font-weight:900;
    line-height:1;
    text-shadow:0 2px 8px rgba(0,0,0,.75);
    position:relative;
    z-index:1;
  }
  .trident {
    position:absolute;
    z-index:0;
    left:50%;
    top: 30%;
    width:48px;
    height:72px;
    object-fit:contain;
    pointer-events:none;
    opacity:0;
    transform:translateX(-50%) translateY(0);
    transform-origin:center top;
  }
  .trident.active { animation:trident-strike 1.4s linear both; }
  .number.out { animation:number-drop 1.4s linear both; }
  .number.tick {
    animation:number-fall .55s cubic-bezier(.2,1.25,.35,1) both;
  }
  .champions-center {
    position:absolute;
    z-index:2;
    top:50%;
    left:50%;
    display:flex;
    width:var(--logo-w);
    height:140px;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    transform:translate(-50%,-50%);
  }
  .champions-logo {
    display:block;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    filter:drop-shadow(0 5px 5px rgba(0,0,0,.8));
    transform-style:preserve-3d;
    animation:logo-spin 30s linear infinite;
  }
  @keyframes sweep { 0% { left:-20%; opacity:0; } 10% { opacity:1; } 55% { left:110%; opacity:1; } 60%,100% { left:110%; opacity:0; } }
  @keyframes texture-drift { from { background-position:0 0; } to { background-position:22px 0; } }
  @keyframes pulse { 0% { transform:scale(.6); opacity:.7; } 15%,100% { transform:scale(7); opacity:0; } }
  @keyframes glow-breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @keyframes logo-spin {
    0% { transform:rotateY(0); }
    4% { transform:rotateY(360deg); }
    100% { transform:rotateY(360deg); }
  }
  @keyframes score-pop {
    0% { transform:translateY(-16px) scale(1.2); opacity:0; }
    100% { transform:translateY(0) scale(1); opacity:1; }
  }
  @keyframes number-drop {
    0%,38% { opacity:1; transform:translateY(0) scale(1); animation-timing-function:ease-in; }
    44% { opacity:1; transform:translateY(-4px) scale(1.12); animation-timing-function:ease-in; }
    100% { opacity:0; transform:translateY(var(--d,150px)) scale(.72); }
  }
  @keyframes number-fall {
    0% { opacity:0; transform:translateY(-70px) scale(.72); }
    70% { opacity:1; transform:translateY(5px) scale(1.04); }
    100% { opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes trident-strike {
    0% { opacity:0; transform:translateX(-50%) translateY(0); animation-timing-function:cubic-bezier(.2,.7,.3,1); }
    38% { opacity:1; transform:translateX(-50%) translateY(calc(var(--d,12px) * -1)); animation-timing-function:ease-in; }
    44% { opacity:1; transform:translateX(-50%) translateY(calc(var(--d,12px) * -1)); animation-timing-function:ease-in; }
    100% { opacity:0; transform:translateX(-50%) translateY(0); }
  }
  @media (max-width:500px) {
    .wrap { padding:32px 16px; }
    .card { padding:0 12px; }
    :root { --logo-w:100px; }
    .champions-center { height:110px; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="card" id="card" aria-label="FUT Champions wins and losses">
    <div class="bg" aria-hidden="true"><span class="line-motion"></span><span class="pulse"></span><span class="pulse two"></span><div class="fire" id="fire"></div></div>
    <span class="edge win" aria-hidden="true"></span>
    <span class="edge loss" aria-hidden="true"></span>
    <div class="scoreline">
      <div class="side wins"><span class="number" id="w">0</span><img class="trident" id="w-trident" src="/assets/Luc1fer24/trident-v2.png?v=2" alt=""></div>
      <div class="champions-center">
          <img class="champions-logo" src="/assets/Luc1fer24/Luc1fer24_logo.png" alt="Luc1fer24">
      </div>
      <div class="side loss"><span class="number" id="l">0</span><img class="trident" id="l-trident" src="/assets/Luc1fer24/trident-v2.png?v=2" alt=""></div>
    </div>
  </section>
</div>
<script>
  const BASE = location.protocol === 'file:' ? 'http://localhost:3000' : '';
  const card = document.getElementById('card');
  const fire = document.getElementById('fire');
  const SVGNS = 'http://www.w3.org/2000/svg';

  // Overlapping teardrop tongues, wider than their spacing, so the row is
  // continuous: no gaps, no flat edges along the flame line.
  function buildFire() {
    const W = Math.max(card.clientWidth, 100), H = 44;
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('preserveAspectRatio', 'none');
    const layers = [
      { color:'#7a0008', step:22, h:[28,44], w:1.9, y:6 },
      { color:'#d3101a', step:18, h:[22,36], w:1.9, y:4 },
      { color:'#ff4a12', step:15, h:[16,28], w:1.9, y:2 },
      { color:'#ff9a1a', step:12, h:[11,19], w:1.9, y:1 },
      { color:'#ffd84a', step:10, h:[6,11], w:1.9, y:0 }
    ];
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (const layer of layers) {
      const g = document.createElementNS(SVGNS, 'g');
      g.setAttribute('fill', layer.color);
      for (let x = -layer.step; x < W + layer.step * 2; x += layer.step * (.8 + rnd() * .4)) {
        const h = layer.h[0] + rnd() * (layer.h[1] - layer.h[0]);
        const hw = layer.step * layer.w;
        const lean = (rnd() - .5) * layer.step * 1.4;
        const base = H + 6, top = H - h + layer.y;
        const path = document.createElementNS(SVGNS, 'path');
        path.setAttribute('d',
          `M${x - hw} ${base} C${x - hw * .5} ${base - h * .35} ${x - hw * .35 + lean * .9} ${top + h * .55} ${x + lean} ${top}` +
          ` C${x + hw * .1 + lean * 1.1} ${top + h * .5} ${x + hw * .5} ${base - h * .35} ${x + hw} ${base} Z`);
        path.setAttribute('class', 'flame');
        path.style.animationDuration = (.7 + rnd() * .9).toFixed(2) + 's';
        path.style.animationDelay = (-rnd() * 2).toFixed(2) + 's';
        path.style.setProperty('--lean', (3 + rnd() * 6).toFixed(1) + 'deg');
        g.appendChild(path);
      }
      svg.appendChild(g);
    }
    fire.replaceChildren(svg);
  }
  let fireWidth = 0;
  new ResizeObserver(() => { if (card.clientWidth !== fireWidth) { fireWidth = card.clientWidth; buildFire(); } }).observe(card);
  buildFire();

  let first = true;
  const timers = {};
  const SCORE_ANIMATION_MS = 1400;

  function setNumber(number, value) {
    number.textContent = value;
    number.classList.remove('out', 'tick');
    void number.offsetWidth;
    number.classList.add('tick');
  }

  function updateScore(id, value) {
    const number = document.getElementById(id);
    const trident = document.getElementById(id + '-trident');
    const previous = Number(number.dataset.value ?? number.textContent);
    number.dataset.value = String(value);
    clearTimeout(timers[id]);
    trident.classList.remove('active');
    if (first || value <= previous) {
      number.classList.remove('out', 'tick');
      number.textContent = value;
      return;
    }
    const numberDist = card.getBoundingClientRect().bottom
      - (number.parentElement.getBoundingClientRect().top + number.parentElement.offsetHeight / 2)
      - 14;
    const tridentDist = card.getBoundingClientRect().bottom
      - (number.parentElement.getBoundingClientRect().top + number.parentElement.offsetHeight / 2)
      - trident.offsetHeight / 2;
    trident.style.setProperty('--d', tridentDist + 'px');
    number.style.setProperty('--d', numberDist + 'px');
    void trident.offsetWidth;
    trident.classList.add('active');
    number.classList.remove('tick');
    number.classList.add('out');
    timers[id] = setTimeout(() => {
      setNumber(number, number.dataset.value);
      trident.classList.remove('active');
    }, SCORE_ANIMATION_MS);
  }

  function render(state) {
    updateScore('w', state.wins);
    updateScore('l', state.losses);
    first = false;
  }

  const roomMatch = location.pathname.match(/^\/room\/([a-f0-9]{32})\//);
  const isPreview = new URLSearchParams(location.search).get('preview') === '1' || location.pathname.startsWith('/preview/');

  if (isPreview) {
    if (window.self === window.top) {
      const homeLink = document.createElement('a');
      homeLink.href = '/';
      homeLink.textContent = '← Scoreboard Studio';
      homeLink.style.cssText = 'position:fixed;top:10px;left:12px;color:#fff;font:700 11px "Cruyff Sans",Arial,sans-serif;text-decoration:none';
      document.body.appendChild(homeLink);
    }
    render({ wins:5, losses:4, history:[...'WLWWLWWLL'], max:15 });
  } else {
    new EventSource(roomMatch ? `/room/${roomMatch[1]}/events` : BASE + '/default/events').onmessage = event => render(JSON.parse(event.data));
  }
</script>
</body>
</html>
