<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Scoreboard Overlay</title>
<style>
  :root {
    color-scheme:dark;
    --accent:#78e6df;
    --accent-soft:#d4f8e9;
    --second:#e8c77e;
    --muted:#a3b5bb;
    --overlay-width:400px;
  }
  html, body { margin:0; background:transparent; color:#fff; font-family:"Segoe UI",Arial,sans-serif; }
  .wrap { display:inline-block; padding:20px; }
  .card {
    position:relative;
    box-sizing:border-box;
    width:min(var(--overlay-width),calc(100vw - 24px));
    overflow:hidden;
    padding:15px 20px 13px;
    border:1px solid color-mix(in srgb,var(--accent) 65%,transparent);
    border-radius:15px;
    background:transparent;
    box-shadow:0 0 18px color-mix(in srgb,var(--accent) 13%,transparent);
    animation:border-glow 4s ease-in-out infinite;
  }
  .card::before { position:absolute; inset:5px; border:1px solid rgba(255,255,255,.07); border-radius:10px; content:""; pointer-events:none; }
  .card::after { position:absolute; top:0; right:0; width:45%; height:2px; background:linear-gradient(90deg,transparent,var(--second),var(--accent)); content:""; }
  .scoreline { display:grid; grid-template-columns:1fr 48px 1fr; align-items:center; }
  .side { display:flex; align-items:center; gap:9px; }
  .side.loss { justify-content:flex-end; }
  .number { color:var(--second); font-size:43px; font-weight:850; line-height:.95; letter-spacing:-2px; text-shadow:0 0 18px color-mix(in srgb,var(--second) 32%,transparent); }
  .loss .number { color:#f5f8fa; text-shadow:0 0 18px color-mix(in srgb,var(--accent) 20%,transparent); }
  .separator { display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:23px; text-align:center; }
  .progress-row { display:flex; align-items:center; gap:9px; margin-top:11px; }
  .segments { display:grid; flex:1; grid-template-columns:repeat(15,1fr); gap:4px; }
  .segment { height:3px; border-radius:3px; background:rgba(236,240,244,.2); }
  .segment.win { background:linear-gradient(90deg,var(--accent),var(--accent-soft)); box-shadow:0 0 7px color-mix(in srgb,var(--accent) 50%,transparent); }
  .segment.loss { background:linear-gradient(90deg,#ff626f,#ff9a86); box-shadow:0 0 7px rgba(255,98,111,.55); }
  .pumpkin { display:none; width:44px; height:40px; flex:none; filter:drop-shadow(0 0 8px rgba(255,117,37,.5)); animation:haunt 5s ease-in-out infinite; }
  .card.halloween { --accent:#bd83ff; --accent-soft:#f0b6ff; --second:#ffbd75; --muted:#b1a0bd; }
  .card.halloween .pumpkin { display:block; }
  .card.halloween .separator { color:#ff9a52; }
  .card.results { width:min(320px,calc(100vw - 24px)); padding:13px 15px; }
  .result-list { position:relative; display:flex; flex-direction:column; gap:8px; }
  .result-row { display:grid; grid-template-columns:35px 1fr; align-items:center; gap:10px; padding:7px 8px; border:1px solid color-mix(in srgb,var(--accent) 32%,transparent); border-radius:9px; background:rgba(255,255,255,.025); }
  .result-index { color:var(--muted); font-size:10px; font-weight:800; text-align:center; }
  .result-content { min-width:0; }
  .result-score { display:flex; align-items:baseline; gap:7px; font-size:19px; font-weight:850; line-height:1; }
  .result-wins { color:var(--accent-soft); }
  .result-losses { color:#ff7c83; }
  .result-dash { color:var(--muted); font-size:14px; }
  .result-segments { display:grid; grid-template-columns:repeat(15,1fr); gap:3px; margin-top:6px; }
  .result-segments .segment { height:2px; }
  .number.tick { animation:score-pop .48s cubic-bezier(.2,1.35,.35,1); }
  .card.flash { animation:border-glow 4s ease-in-out infinite,card-flash .55s ease-out; }
  @keyframes border-glow {
    0%,100% { border-color:color-mix(in srgb,var(--accent) 58%,transparent); box-shadow:0 0 12px color-mix(in srgb,var(--accent) 10%,transparent); }
    50% { border-color:var(--accent); box-shadow:0 0 23px color-mix(in srgb,var(--accent) 34%,transparent); }
  }
  @keyframes score-pop { 0% { transform:translateY(-16px) scale(1.2); opacity:0; } 100% { transform:translateY(0) scale(1); opacity:1; } }
  @keyframes card-flash { 45% { filter:brightness(1.6); box-shadow:0 0 34px color-mix(in srgb,var(--accent) 42%,transparent); } }
  @keyframes haunt { 0%,100% { transform:rotate(0) translateY(0); } 45% { transform:rotate(-4deg) translateY(-2px); } 70% { transform:rotate(3deg) translateY(1px); } }
  @media (max-width:500px) {
    .wrap { padding:12px; }
    .card { padding:13px; }
    .scoreline { grid-template-columns:1fr 40px 1fr; }
    .side { gap:6px; }
    .number { font-size:35px; }
    .segments { gap:2px; }
    .pumpkin { width:36px; height:33px; }
  }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="card" id="card" aria-label="Personal wins and losses">
    <div class="scoreline" id="scoreline">
      <div class="side"><span class="number" id="w">0</span></div>
      <span class="separator" id="separator">—<svg class="pumpkin" viewBox="0 0 64 56" role="img" aria-label="Glowing jack-o'-lantern">
        <defs>
          <linearGradient id="gourd" x1="12" y1="11" x2="51" y2="47" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ffbd56"/><stop offset=".48" stop-color="#ff812b"/><stop offset="1" stop-color="#c74416"/>
          </linearGradient>
          <linearGradient id="glow" x1="25" y1="24" x2="39" y2="41" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fff4a3"/><stop offset="1" stop-color="#ffb42e"/>
          </linearGradient>
        </defs>
        <path d="M31 13c-1-5 1-9 5-11 2 4 1 7-2 10l-1 3" fill="#72934c" stroke="#a8b867" stroke-width="1.5"/>
        <path d="M32 14c-5-5-15-3-18 3-9 1-12 9-10 18 2 11 12 17 28 17s26-6 28-17c2-9-1-17-10-18-4-6-13-8-18-3Z" fill="url(#gourd)" stroke="#ffb14b" stroke-width="1.5"/>
        <path d="M32 14c-4 7-4 27 0 38M17 18c-5 8-5 22 1 29M47 18c5 8 5 22-1 29" fill="none" stroke="#a83c1b" stroke-opacity=".55" stroke-width="2"/>
        <path d="m15 25 13 3-7 8-6-11Zm34 0-13 3 7 8 6-11Z" fill="url(#glow)"/>
        <path d="m24 41 5-3 3 3 4-3 7 3-4 5H28l-4-5Z" fill="url(#glow)"/>
      </svg></span>
      <div class="side loss"><span class="number" id="l">0</span></div>
    </div>
    <div class="progress-row" id="progress-row">
      <div class="segments" id="segments" aria-label="Match result history"></div>
    </div>
    <div class="result-list" id="result-list" hidden></div>
  </section>
</div>
<script>
  const pathParts = location.pathname.split('/');
  const isPreview = pathParts[1] === 'preview' || new URLSearchParams(location.search).get('preview') === '1';
  const viewId = isPreview ? null : pathParts[2];
  const requestedTheme = pathParts[1] === 'preview' ? pathParts[2] : isPreview ? pathParts[1] : pathParts[3];
  const theme = requestedTheme === 'champions' ? 'default' : requestedTheme;
  const isResults = !isPreview && pathParts[4] === 'results';
  const card = document.getElementById('card');
  card.classList.add(theme);
  if (isResults) {
    card.classList.add('results');
    document.getElementById('scoreline').hidden = true;
    document.getElementById('progress-row').hidden = true;
    document.getElementById('result-list').hidden = false;
  }
  if (theme === 'halloween') {
    document.getElementById('separator').firstChild.textContent = '';
  }

  const segments = document.getElementById('segments');
  for (let i = 0; i < 15; i++) {
    const segment = document.createElement('span');
    segment.className = 'segment';
    segments.appendChild(segment);
  }
  let first = true;

  function updateScore(id, value) {
    const number = document.getElementById(id);
    if (number.textContent === String(value)) return;
    number.textContent = value;
    if (first) return;
    number.classList.remove('tick');
    void number.offsetWidth;
    number.classList.add('tick');
    card.classList.remove('flash');
    void card.offsetWidth;
    card.classList.add('flash');
  }

  function render(state) {
    if (isResults) {
      renderResults(state.championsResults);
      first = false;
      return;
    }
    updateScore('w', state.wins);
    updateScore('l', state.losses);
    const total = state.wins + state.losses;
    const history = Array.isArray(state.history) && state.history.length === total
      ? state.history
      : [...'W'.repeat(state.wins), ...'L'.repeat(state.losses)];
    [...segments.children].forEach((segment, index) => {
      const result = history[index];
      segment.classList.toggle('win', result === 'W');
      segment.classList.toggle('loss', result === 'L');
      segment.title = result === 'W' ? `Match ${index + 1}: Win` : result === 'L' ? `Match ${index + 1}: Loss` : `Match ${index + 1}: Not played`;
    });
    first = false;
  }

  function renderResults(results) {
    const list = document.getElementById('result-list');
    list.replaceChildren();
    if (!Array.isArray(results)) return;
    [...results].slice(-15).reverse().forEach((result, index) => {
      const row = document.createElement('div');
      row.className = 'result-row';
      const number = document.createElement('span');
      number.className = 'result-index';
      number.textContent = String(index + 1).padStart(2, '0');
      const content = document.createElement('div');
      content.className = 'result-content';
      const score = document.createElement('div');
      score.className = 'result-score';
      const wins = document.createElement('span');
      wins.className = 'result-wins';
      wins.textContent = result.wins;
      const dash = document.createElement('span');
      dash.className = 'result-dash';
      dash.textContent = '—';
      const losses = document.createElement('span');
      losses.className = 'result-losses';
      losses.textContent = result.losses;
      score.append(wins, dash, losses);
      const resultSegments = document.createElement('div');
      resultSegments.className = 'result-segments';
      const total = Number(result.wins) + Number(result.losses);
      const history = Array.isArray(result.history) && result.history.length === total
        ? result.history
        : [...'W'.repeat(Number(result.wins)), ...'L'.repeat(Number(result.losses))];
      for (let i = 0; i < 15; i++) {
        const segment = document.createElement('span');
        segment.className = `segment${history[i] === 'W' ? ' win' : history[i] === 'L' ? ' loss' : ''}`;
        resultSegments.appendChild(segment);
      }
      content.append(score, resultSegments);
      row.append(number, content);
      list.appendChild(row);
    });
  }

  if (isPreview) {
    render({ wins:5, losses:4, history:[...'WLWWLWWLL'], max:15, championsResults:[] });
  } else {
    new EventSource(`/room/${viewId}/events`).onmessage = event => render(JSON.parse(event.data));
  }
</script>
</body>
</html>
