<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halloween Score Control</title>
<style>
  :root { color-scheme:dark; --orange:#ff7a1a; --purple:#a34dff; }
  body { margin:0; padding:16px; background:#140e1d; color:#fff; font-family:"Segoe UI",Helvetica,Arial,sans-serif; text-align:center; }
  h1 { margin:0 0 5px; color:#ffb56e; font-size:18px; letter-spacing:2px; }
  .subtitle { margin:0 0 14px; color:#c0a7ce; font-size:12px; }
  .score { margin-bottom:14px; color:#fff; font-size:30px; font-weight:800; }
  .score span:first-child { color:#ff9d48; }
  .score span:last-child { color:#c394ff; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { border:0; border-radius:10px; padding:15px 8px; color:#1a1020; font-size:17px; font-weight:800; cursor:pointer; }
  button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  .win { background:linear-gradient(135deg,#ffb347,#ff761a); }
  .loss { background:linear-gradient(135deg,#d5a4ff,#9c4dff); }
  .small { background:#33243d; color:#fff; font-size:14px; font-weight:650; }
  .set { margin-top:16px; padding-top:14px; border-top:1px solid #46314f; }
  .set h2 { margin:0 0 10px; color:#e4c8f5; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  label { display:block; margin-bottom:4px; color:#c0a7ce; font-size:12px; }
  input { box-sizing:border-box; width:100%; padding:9px 0; border:2px solid #46314f; border-radius:8px; background:#0d0912;
          color:#fff; font-size:22px; font-weight:700; text-align:center; }
  input:focus { outline:none; border-color:var(--orange); }
  .set button { width:100%; margin-top:10px; background:var(--orange); font-size:15px; }
  .hint { margin-top:12px; color:#a995b3; font-size:12px; }
  .home-link { display:inline-block; margin-bottom:12px; color:#ffbd75; font-size:11px; text-decoration:none; }
</style>
</head>
<body>
<a class="home-link" href="/">← Scoreboard Studio</a>
<h1>☾ HALLOWEEN WL ☽</h1>
<p class="subtitle">Track your spooky season run</p>
<div class="score"><span id="w">0</span> W – <span id="l">0</span> L</div>
<div class="btns">
  <button class="win" onclick="act('win')">+ WIN (W)</button>
  <button class="loss" onclick="act('loss')">+ LOSS (L)</button>
  <button class="small" onclick="act('undo')">Undo (U)</button>
  <button class="small" onclick="if(confirm('Reset the Halloween run?'))act('reset')">Reset run</button>
</div>
<div class="set">
  <h2>Set score</h2>
  <div class="fields">
    <div><label for="sw">Wins</label><input id="sw" type="number" min="0" max="999" inputmode="numeric"></div>
    <div><label for="sl">Losses</label><input id="sl" type="number" min="0" max="999" inputmode="numeric"></div>
  </div>
  <button onclick="setValues()">Set score</button>
</div>
<div class="hint">Hotkeys: W = win, L = loss, U = undo</div>
<script>
  const BASE = location.protocol === 'file:' ? 'http://localhost:3000' : '';
  const getPw = () => { try { return localStorage.getItem('pw') || ''; } catch { return ''; } };
  async function act(action, query = '') {
    const response = await fetch(BASE + '/api/halloween/' + action + query, {
      method:'POST',
      headers:{ 'x-password':getPw() }
    });
    if (response.status === 401) {
      const password = prompt('Control password:');
      if (password === null) return;
      try { localStorage.setItem('pw', password); } catch {}
      return act(action, query);
    }
    if (!response.ok) throw new Error(`Request failed (${response.status})`);
  }
  new EventSource(BASE + '/halloween/events').onmessage = event => {
    const state = JSON.parse(event.data);
    document.getElementById('w').textContent = state.wins;
    document.getElementById('l').textContent = state.losses;
    for (const [id, value] of [['sw', state.wins], ['sl', state.losses]]) {
      const input = document.getElementById(id);
      if (document.activeElement !== input) input.value = value;
    }
  };
  function setValues() {
    const query = new URLSearchParams();
    const wins = document.getElementById('sw').value;
    const losses = document.getElementById('sl').value;
    if (wins !== '') query.set('wins', wins);
    if (losses !== '') query.set('losses', losses);
    act('set', '?' + query);
    document.activeElement.blur();
  }
  for (const id of ['sw', 'sl']) {
    document.getElementById(id).addEventListener('keydown', event => {
      if (event.key === 'Enter') setValues();
    });
  }
  addEventListener('keydown', event => {
    if (event.target.tagName === 'INPUT') return;
    const key = event.key.toLowerCase();
    if (key === 'w') act('win');
    else if (key === 'l') act('loss');
    else if (key === 'u') act('undo');
  });
</script>
</body>
</html>
